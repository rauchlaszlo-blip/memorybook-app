name: Notification mobile panel fix

on:
  push:
    branches:
      - notification-deeplink-2026-09-08

permissions:
  contents: write

jobs:
  fix-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: notification-deeplink-2026-09-08

      - name: Keep notification bell at the right edge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/MyBooksPage.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''          <div style={styles.headerActions}>
  <NotificationMenu />
  <button type="button" onClick={signOut} style={styles.secondaryButton}>Kijelentkezés</button>
</div>'''
          new = '''          <div style={styles.headerActions}>
            <button type="button" onClick={signOut} style={styles.secondaryButton}>Kijelentkezés</button>
            <NotificationMenu />
          </div>'''
          if old not in text:
              raise SystemExit('Header action marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Remove temporary workflow and commit checked fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/notification-mobile-panel-fix.yml
          git add src/MyBooksPage.tsx
          git commit -m "Fix notification panel on mobile"
          git push origin HEAD:notification-deeplink-2026-09-08
