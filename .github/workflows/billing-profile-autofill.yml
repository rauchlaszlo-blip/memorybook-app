name: Billing profile autofill
on:
  push:
    branches: [billing-profile-autofill]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: billing-profile-autofill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add billing profile persistence and postal lookup
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('server/index.ts')
          text = server.read_text(encoding='utf-8')

          marker = "const DEMO_BOOK_ID = 'book-12b';\n"
          if marker not in text:
              raise SystemExit('DEMO_BOOK_ID marker not found')
          text = text.replace(marker, marker + "const postalLookupCache = new Map<string, string>();\n", 1)

          marker = "app.get('/api/invoicing-capabilities', (_req, res) => {\n"
          postal_route = """app.get('/api/postal-lookup/:country/:postalCode', async (req, res) => {\n  const country = String(req.params.country || '').trim().toUpperCase();\n  const postalCode = String(req.params.postalCode || '').trim();\n\n  if (country !== 'HU' || !/^\\d{4}$/.test(postalCode)) {\n    res.status(400).json({ error: 'INVALID_POSTAL_LOOKUP' });\n    return;\n  }\n\n  const cacheKey = `${country}:${postalCode}`;\n  const cachedCity = postalLookupCache.get(cacheKey);\n  if (cachedCity) {\n    res.status(200).json({ country, postalCode, city: cachedCity });\n    return;\n  }\n\n  try {\n    const response = await fetch(`https://api.zippopotam.us/${country}/${encodeURIComponent(postalCode)}`);\n    if (response.status === 404) {\n      res.status(404).json({ error: 'POSTAL_CODE_NOT_FOUND' });\n      return;\n    }\n    if (!response.ok) {\n      res.status(502).json({ error: 'POSTAL_LOOKUP_FAILED' });\n      return;\n    }\n\n    const data: any = await response.json();\n    const cities = Array.from(\n      new Set(\n        (Array.isArray(data?.places) ? data.places : [])\n          .map((place: any) => String(place?.['place name'] || '').trim())\n          .filter(Boolean)\n      )\n    ) as string[];\n    const city = cities[0] || '';\n    if (!city) {\n      res.status(404).json({ error: 'POSTAL_CODE_NOT_FOUND' });\n      return;\n    }\n\n    postalLookupCache.set(cacheKey, city);\n    res.status(200).json({ country, postalCode, city });\n  } catch (err) {\n    console.error('Postal lookup error:', err);\n    res.status(502).json({ error: 'POSTAL_LOOKUP_FAILED' });\n  }\n});\n\n"""
          if marker not in text:
              raise SystemExit('Invoicing route marker not found')
          text = text.replace(marker, postal_route + marker, 1)

          marker = "\n\napp.get('/api/my/notifications', async (req, res) => {\n"
          profile_route = """\n\napp.get('/api/my/billing-profile', async (req, res) => {\n  if (!auth) {\n    res.status(503).json({ error: 'AUTH_NOT_CONFIGURED' });\n    return;\n  }\n\n  try {\n    const session = await getSession(req);\n    if (!session) {\n      res.status(401).json({ error: 'UNAUTHENTICATED' });\n      return;\n    }\n\n    const result = await pool.query(\n      `SELECT\n         billing_name AS \"billingName\",\n         billing_email AS \"billingEmail\",\n         billing_country AS \"billingCountry\",\n         billing_postal_code AS \"billingPostalCode\",\n         billing_city AS \"billingCity\",\n         billing_address AS \"billingAddress\",\n         billing_tax_number AS \"billingTaxNumber\",\n         updated_at AS \"updatedAt\"\n       FROM billing_profiles\n       WHERE user_id = $1`,\n      [session.user.id]\n    );\n\n    res.status(200).json({ billingProfile: result.rows[0] || null });\n  } catch (err) {\n    console.error('Billing profile load error:', err);\n    res.status(500).json({ error: 'BILLING_PROFILE_LOAD_FAILED' });\n  }\n});\n"""
          if marker not in text:
              raise SystemExit('Notifications route marker not found')
          text = text.replace(marker, profile_route + marker, 1)

          purchase_marker = """  try {\n    const result = await pool.query(\n      `INSERT INTO purchases (\n"""
          purchase_replacement = """  try {\n    if (session) {\n      await pool.query(\n        `INSERT INTO billing_profiles (\n           user_id,\n           billing_name,\n           billing_email,\n           billing_country,\n           billing_postal_code,\n           billing_city,\n           billing_address,\n           billing_tax_number,\n           updated_at\n         )\n         VALUES ($1, $2, $3, $4, $5, $6, $7, NULLIF($8, ''), CURRENT_TIMESTAMP)\n         ON CONFLICT (user_id) DO UPDATE SET\n           billing_name = EXCLUDED.billing_name,\n           billing_email = EXCLUDED.billing_email,\n           billing_country = EXCLUDED.billing_country,\n           billing_postal_code = EXCLUDED.billing_postal_code,\n           billing_city = EXCLUDED.billing_city,\n           billing_address = EXCLUDED.billing_address,\n           billing_tax_number = EXCLUDED.billing_tax_number,\n           updated_at = CURRENT_TIMESTAMP`,\n        [\n          session.user.id,\n          billingName,\n          billingEmail,\n          billingCountry,\n          billingPostalCode,\n          billingCity,\n          billingAddress,\n          billingTaxNumber,\n        ]\n      );\n    }\n\n    const result = await pool.query(\n      `INSERT INTO purchases (\n"""
          if purchase_marker not in text:
              raise SystemExit('Purchase insert marker not found')
          text = text.replace(purchase_marker, purchase_replacement, 1)

          migration_marker = """  const invoicingMigration = await fs.readFile(\n"""
          migration_load = """  const billingProfilesMigration = await fs.readFile(\n    path.join(process.cwd(), 'server', 'migrations', '20260909_billing_profiles.sql'),\n    'utf8'\n  );\n  await pool.query(billingProfilesMigration);\n\n"""
          if migration_marker not in text:
              raise SystemExit('Invoicing migration marker not found')
          text = text.replace(migration_marker, migration_load + migration_marker, 1)

          server.write_text(text, encoding='utf-8')

          page = Path('src/PurchasePage.tsx')
          text = page.read_text(encoding='utf-8')

          marker = "type UserData = { id: string; name?: string; email?: string };\n"
          billing_type = """type BillingProfile = {\n  billingName?: string;\n  billingEmail?: string;\n  billingCountry?: string;\n  billingPostalCode?: string;\n  billingCity?: string;\n  billingAddress?: string;\n  billingTaxNumber?: string | null;\n};\n"""
          if marker not in text:
              raise SystemExit('UserData marker not found')
          text = text.replace(marker, marker + billing_type, 1)

          marker = """  }, []);\n\n  useEffect(() => {\n    const query = new URLSearchParams(window.location.search);\n"""
          effects = """  }, []);\n\n  useEffect(() => {\n    if (!user) return;\n\n    let active = true;\n    fetch(`${API_BASE}/api/my/billing-profile`, { credentials: 'include' })\n      .then(async (response) => response.ok ? response.json() : null)\n      .then((data) => {\n        if (!active) return;\n        const profile = (data?.billingProfile || null) as BillingProfile | null;\n        if (!profile) return;\n\n        setBillingName(profile.billingName || user.name || '');\n        setBillingEmail(profile.billingEmail || user.email || '');\n        setBillingCountry(profile.billingCountry || 'Magyarország');\n        setBillingPostalCode(profile.billingPostalCode || '');\n        setBillingCity(profile.billingCity || '');\n        setBillingAddress(profile.billingAddress || '');\n        setBillingTaxNumber(profile.billingTaxNumber || '');\n      })\n      .catch(() => {});\n\n    return () => { active = false; };\n  }, [user]);\n\n  useEffect(() => {\n    const normalizedCountry = billingCountry.trim().toLocaleLowerCase('hu-HU');\n    const isHungary = normalizedCountry === 'magyarország' || normalizedCountry === 'hungary' || normalizedCountry === 'hu';\n    const postalCode = billingPostalCode.trim();\n    if (!isHungary || !/^\\d{4}$/.test(postalCode)) return;\n\n    let active = true;\n    const timer = window.setTimeout(() => {\n      fetch(`${API_BASE}/api/postal-lookup/HU/${encodeURIComponent(postalCode)}`)\n        .then(async (response) => response.ok ? response.json() : null)\n        .then((data) => {\n          if (!active) return;\n          const city = String(data?.city || '').trim();\n          if (city) setBillingCity(city);\n        })\n        .catch(() => {});\n    }, 250);\n\n    return () => {\n      active = false;\n      window.clearTimeout(timer);\n    };\n  }, [billingCountry, billingPostalCode]);\n\n  useEffect(() => {\n    const query = new URLSearchParams(window.location.search);\n"""
          if marker not in text:
              raise SystemExit('Purchase effect marker not found')
          text = text.replace(marker, effects, 1)

          postal_input = """              <input value={billingPostalCode} onChange={(event) => setBillingPostalCode(event.target.value)} style={styles.input} />\n"""
          postal_input_new = """              <input\n                value={billingPostalCode}\n                inputMode={billingCountry.trim().toLocaleLowerCase('hu-HU') === 'magyarország' ? 'numeric' : undefined}\n                onChange={(event) => setBillingPostalCode(event.target.value)}\n                style={styles.input}\n              />\n"""
          if postal_input not in text:
              raise SystemExit('Postal input marker not found')
          text = text.replace(postal_input, postal_input_new, 1)

          page.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts src/PurchasePage.tsx server/migrations/20260909_billing_profiles.sql
          git commit -m "Remember billing details and autofill Hungarian city"
          git push origin HEAD:billing-profile-autofill
