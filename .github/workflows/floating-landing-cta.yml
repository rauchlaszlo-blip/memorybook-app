name: Floating landing CTA check

on:
  push:
    branches:
      - floating-landing-cta

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Replace two inline CTAs with one floating CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/LandingPage.tsx')
          s = p.read_text(encoding='utf-8')

          hero = '''        <div style={styles.heroActions}>\n          <a href="/purchase" style={styles.primaryButton}>{copy.primaryCta}</a>\n        </div>\n'''
          bottom = '''        <a href="/purchase" style={styles.primaryButton}>{copy.bottomCta}</a>\n'''
          header = '''      </header>\n\n      <section style={styles.hero}>'''
          floating = '''      </header>\n\n      <a href="/purchase" style={styles.floatingCta} aria-label={copy.primaryCta}>\n        {copy.primaryCta}\n      </a>\n\n      <section style={styles.hero}>'''
          style_anchor = '''  section: { width: '100%', maxWidth: 980, margin: '0 auto 70px' },'''
          floating_style = '''  floatingCta: {\n    position: 'fixed',\n    top: '32vh',\n    right: 'clamp(12px, 3vw, 36px)',\n    zIndex: 20,\n    minHeight: 48,\n    maxWidth: 'min(260px, calc(100vw - 24px))',\n    padding: '12px 17px',\n    boxSizing: 'border-box',\n    display: 'inline-flex',\n    alignItems: 'center',\n    justifyContent: 'center',\n    borderRadius: 999,\n    background: '#0f172a',\n    color: '#ffffff',\n    textDecoration: 'none',\n    textAlign: 'center',\n    fontWeight: 900,\n    lineHeight: 1.25,\n    boxShadow: '0 12px 28px rgba(15, 23, 42, 0.24)',\n  },\n  section: { width: '100%', maxWidth: 980, margin: '0 auto 70px' },'''

          for old, new, label in [
              (hero, '', 'hero CTA'),
              (bottom, '', 'bottom CTA'),
              (header, floating, 'floating CTA insertion'),
              (style_anchor, floating_style, 'floating CTA style'),
          ]:
              if old not in s:
                  raise SystemExit(f'Missing expected anchor: {label}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Verify scoped CTA change
        run: |
          test "$(grep -o 'href="/purchase"' src/LandingPage.tsx | wc -l)" -eq 1
          grep -F 'style={styles.floatingCta}' src/LandingPage.tsx
          grep -F "top: '32vh'" src/LandingPage.tsx
          grep -F "right: 'clamp(12px, 3vw, 36px)'" src/LandingPage.tsx
          ! grep -F 'style={styles.primaryButton}>{copy.bottomCta}' src/LandingPage.tsx
          ! grep -F 'style={styles.primaryButton}>{copy.primaryCta}' src/LandingPage.tsx
          git diff --check
      - name: Commit tested change and remove workflow
        run: |
          rm .github/workflows/floating-landing-cta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LandingPage.tsx .github/workflows/floating-landing-cta.yml
          git commit -m "Replace landing CTAs with floating button"
          git push
