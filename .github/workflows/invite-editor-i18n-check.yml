name: Invite editor localization check

on:
  push:
    branches:
      - invite-editor-i18n-2026-09-08

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: invite-editor-i18n-2026-09-08

      - name: Add HU EN invite editor localization
        run: |
