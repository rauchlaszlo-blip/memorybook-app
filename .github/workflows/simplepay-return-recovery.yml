name: SimplePay delayed IPN return recovery

on:
  push:
    branches:
      - simplepay-http-ui-wiring

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[simplepay-return-recovery]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve return URL while IPN is pending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/PurchasePage.tsx')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          marker = 'A SimplePay fizetés még feldolgozás alatt van.'
          marker_indexes = [i for i, line in enumerate(lines) if marker in line]
          if len(marker_indexes) != 1:
              raise SystemExit(f'expected one pending marker, found {len(marker_indexes)}')
          start = marker_indexes[0]
          matches = [
              i for i in range(start + 1, min(start + 5, len(lines)))
              if "window.history.replaceState({}, '', '/purchase');" in lines[i]
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected one nearby replaceState, found {len(matches)}')
          del lines[matches[0]]
          p.write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Backend TypeScript check
        run: npx tsc --ignoreConfig --noEmit --target ES2023 --module ESNext --moduleResolution Bundler --types node --skipLibCheck server/index.ts server/db.ts server/payments/simplepay.ts server/payments/simplepay-purchase.ts
      - name: Verify pending recovery and diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/PurchasePage.tsx').read_text(encoding='utf-8')
          marker = 'A SimplePay fizetés még feldolgozás alatt van.'
          start = text.index(marker)
          nearby = text[start:start + 500]
          assert "window.history.replaceState({}, '', '/purchase');" not in nearby
          print('Delayed IPN return recovery PASS')
          PY
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/simplepay-return-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve SimplePay return state for delayed IPN [simplepay-return-recovery]"
          git push origin HEAD:simplepay-http-ui-wiring
