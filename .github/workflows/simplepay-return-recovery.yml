name: SimplePay delayed IPN return recovery

on:
  push:
    branches:
      - simplepay-http-ui-wiring

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[simplepay-return-recovery]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve return URL while IPN is pending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/PurchasePage.tsx')
          text = p.read_text(encoding='utf-8')
          old = """          setNotice(t('A SimplePay fizetés még feldolgozás alatt van. A könyvjogosultság csak a hiteles SimplePay értesítés után jön létre.'));
          setLoading(false);
          window.history.replaceState({}, '', '/purchase');"""
          new = """          setNotice(t('A SimplePay fizetés még feldolgozás alatt van. A könyvjogosultság csak a hiteles SimplePay értesítés után jön létre.'));
          setLoading(false);"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one pending-return match, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Backend TypeScript check
        run: npx tsc --ignoreConfig --noEmit --target ES2023 --module ESNext --moduleResolution Bundler --types node --skipLibCheck server/index.ts server/db.ts server/payments/simplepay.ts server/payments/simplepay-purchase.ts
      - name: Verify pending recovery and diff
        run: |
          grep -F "A SimplePay fizetés még feldolgozás alatt van." src/PurchasePage.tsx
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/simplepay-return-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve SimplePay return state for delayed IPN [simplepay-return-recovery]"
          git push origin HEAD:simplepay-http-ui-wiring
