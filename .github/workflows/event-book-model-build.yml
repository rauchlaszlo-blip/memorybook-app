name: Event Book Model Build
on:
  push:
    branches:
      - event-contribution-management-2026-09-08
    paths:
      - .github/workflows/event-book-model-build.yml
jobs:
  build-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: event-contribution-management-2026-09-08
          fetch-depth: 0
      - name: Apply event book model
        run: python3 scripts/patch-event-book-model.py
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit model
        run: |
          git config user.name "rauchlaszlo-blip"
          git config user.email "rauchlaszlo@gmail.com"
          git add server/index.ts src/MyBooksPage.tsx src/OwnerBookPage.tsx src/EventGuestbookQrPage.tsx src/OrganizerContributionsPage.tsx package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add standard and event book models"
            git push origin HEAD:event-contribution-management-2026-09-08
          fi
