name: Notification branch build

on:
  push:
    branches:
      - notifications-foundation-2026-09-08

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend TypeScript and Vite build
        run: npm run build

      - name: Server TypeScript check
        run: npx tsc --noEmit --module ESNext --moduleResolution Bundler --target ES2022 --esModuleInterop --skipLibCheck server/index.ts server/auth.ts server/db.ts
