name: Invite Send Flow Patch

on:
  push:
    branches:
      - mobile-guest-editor-smoke-2026-09-08
    paths:
      - .github/workflows/invite-send-flow-patch.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build invitation send flow
        shell: bash
        run: |
          cat > src/InviteSendDialog.tsx <<'EOF'
          import { useMemo, useState } from 'react';

          type InviteSendDialogProps = {
            bookTitle: string;
            pageNumber: number;
            pageUrl: string;
            ctaUrl: string;
            onClose: () => void;
          };

          type SendPlatform = 'share' | 'email';

          function buildMessage(bookTitle: string, pageUrl: string, ctaUrl: string) {
            return [
              'Szia!',
              '',
              `Készítettem egy MemoryBook emlékkönyvet: „${bookTitle}”. Szeretném, ha te is készítenél bele egy saját oldalt.`,
              '',
              'A saját oldalad itt éred el:',
              pageUrl,
              '',
              'A link csak a te oldaladhoz tartozik. Ha elkészültél, az oldal alján küldd be.',
              '',
              `👉 Nekem is kell emlékkönyv: ${ctaUrl}`,
            ].join('\n');
          }

          export function InviteSendDialog({
            bookTitle,
            pageNumber,
            pageUrl,
            ctaUrl,
            onClose,
          }: InviteSendDialogProps) {
            const [platform, setPlatform] = useState<SendPlatform>('share');
            const [recipientName, setRecipientName] = useState('');
            const [email, setEmail] = useState('');
            const [message, setMessage] = useState(() => buildMessage(bookTitle, pageUrl, ctaUrl));
            const [sendError, setSendError] = useState<string | null>(null);

            const nativeShareAvailable = useMemo(
              () => typeof navigator.share === 'function',
              []
            );

            const updateRecipientName = (value: string) => {
              setRecipientName(value);
              setMessage((current) => {
                const greeting = value.trim() ? `Szia, ${value.trim()}!` : 'Szia!';
                return current.replace(/^Szia(?:, [^!]+)?!/, greeting);
              });
            };

            const send = async () => {
              setSendError(null);

              if (platform === 'email') {
                const subject = `MemoryBook meghívás – ${bookTitle}`;
                const mailto = `mailto:${encodeURIComponent(email.trim())}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
                window.location.href = mailto;
                return;
              }

              if (!nativeShareAvailable) {
                setSendError(
                  'Ezen az eszközön a rendszer megosztás nem érhető el. Válaszd az E-mail lehetőséget.'
                );
                return;
              }

              try {
                await navigator.share({
                  title: `MemoryBook meghívás – ${bookTitle}`,
                  text: message,
                });
                onClose();
              } catch (err) {
                if (err instanceof DOMException && err.name === 'AbortError') return;
                console.error(err);
                setSendError('Nem sikerült megnyitni a megosztást. Próbáld újra vagy válaszd az E-mailt.');
              }
            };

            return (
              <div style={styles.backdrop} role="presentation" onMouseDown={onClose}>
                <section
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="invite-send-title"
                  style={styles.dialog}
                  onMouseDown={(event) => event.stopPropagation()}
                >
                  <div style={styles.dialogTop}>
                    <div>
                      <div style={styles.eyebrow}>Oldal {pageNumber}</div>
                      <h2 id="invite-send-title" style={styles.title}>Meghívás küldése</h2>
                    </div>
                    <button type="button" onClick={onClose} style={styles.closeButton} aria-label="Bezárás">×</button>
                  </div>

                  <div style={styles.stepLabel}>1. Küldési mód</div>
                  <div style={styles.platformGrid}>
                    <button
                      type="button"
                      onClick={() => setPlatform('share')}
                      style={platform === 'share' ? styles.platformActive : styles.platformButton}
                    >
                      Megosztás…
                      <span style={styles.platformHint}>Messenger, WhatsApp, SMS, e-mail és más telepített app</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => setPlatform('email')}
                      style={platform === 'email' ? styles.platformActive : styles.platformButton}
                    >
                      E-mail
                      <span style={styles.platformHint}>Közvetlenül a levelező alkalmazásban</span>
                    </button>
                  </div>

                  <div style={styles.stepLabel}>2. Személyre szabás</div>
                  <label style={styles.label}>
                    Címzett neve (opcionális)
                    <input
                      value={recipientName}
                      onChange={(event) => updateRecipientName(event.target.value)}
                      placeholder="pl. Anna"
                      style={styles.input}
                      maxLength={80}
                    />
                  </label>

                  {platform === 'email' && (
                    <label style={styles.label}>
                      E-mail cím (opcionális)
                      <input
                        type="email"
                        value={email}
                        onChange={(event) => setEmail(event.target.value)}
                        placeholder="nev@example.com"
                        style={styles.input}
                      />
                    </label>
                  )}

                  <label style={styles.label}>
                    Meghívó üzenet
                    <textarea
                      value={message}
                      onChange={(event) => setMessage(event.target.value)}
                      style={styles.textarea}
                      rows={11}
                    />
                  </label>

                  <div style={styles.note}>
                    A „Nekem is kell emlékkönyv” rész a meghívóban marad, így a címzett saját MemoryBookot is indíthat.
                  </div>

                  {sendError && <div style={styles.error}>{sendError}</div>}

                  <div style={styles.actions}>
                    <button type="button" onClick={onClose} style={styles.secondaryButton}>Mégse</button>
                    <button type="button" onClick={send} style={styles.primaryButton}>
                      {platform === 'email' ? 'E-mail megnyitása' : 'Címzett és app kiválasztása'}
                    </button>
                  </div>
                </section>
              </div>
            );
          }

          const styles: Record<string, React.CSSProperties> = {
            backdrop: {
              position: 'fixed',
              inset: 0,
              zIndex: 1000,
              display: 'grid',
              placeItems: 'center',
              padding: 12,
              background: 'rgba(15, 23, 42, 0.55)',
              boxSizing: 'border-box',
            },
            dialog: {
              width: '100%',
              maxWidth: 620,
              maxHeight: 'calc(100vh - 24px)',
              overflowY: 'auto',
              padding: 18,
              boxSizing: 'border-box',
              borderRadius: 16,
              background: '#ffffff',
              boxShadow: '0 20px 60px rgba(15, 23, 42, 0.25)',
              fontFamily: 'Arial, sans-serif',
            },
            dialogTop: {
              display: 'flex',
              alignItems: 'flex-start',
              justifyContent: 'space-between',
              gap: 12,
              marginBottom: 18,
            },
            eyebrow: { color: '#64748b', fontSize: 12, fontWeight: 800, textTransform: 'uppercase' },
            title: { margin: '4px 0 0', color: '#0f172a', fontSize: 24 },
            closeButton: {
              minWidth: 44,
              minHeight: 44,
              border: '1px solid #cbd5e1',
              borderRadius: 10,
              background: '#ffffff',
              color: '#475569',
              fontSize: 28,
              lineHeight: 1,
            },
            stepLabel: { margin: '16px 0 8px', color: '#334155', fontSize: 13, fontWeight: 800 },
            platformGrid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 220px), 1fr))', gap: 10 },
            platformButton: {
              minHeight: 70,
              padding: 12,
              border: '1px solid #cbd5e1',
              borderRadius: 10,
              background: '#ffffff',
              color: '#334155',
              textAlign: 'left',
              fontSize: 15,
              fontWeight: 800,
            },
            platformActive: {
              minHeight: 70,
              padding: 12,
              border: '2px solid #0f172a',
              borderRadius: 10,
              background: '#f8fafc',
              color: '#0f172a',
              textAlign: 'left',
              fontSize: 15,
              fontWeight: 800,
            },
            platformHint: { display: 'block', marginTop: 5, color: '#64748b', fontSize: 12, fontWeight: 500, lineHeight: 1.35 },
            label: { display: 'block', marginTop: 12, color: '#334155', fontSize: 13, fontWeight: 800 },
            input: {
              width: '100%',
              minHeight: 46,
              marginTop: 6,
              padding: '10px 12px',
              boxSizing: 'border-box',
              border: '1px solid #cbd5e1',
              borderRadius: 8,
              fontSize: 16,
            },
            textarea: {
              width: '100%',
              marginTop: 6,
              padding: 12,
              boxSizing: 'border-box',
              border: '1px solid #cbd5e1',
              borderRadius: 8,
              fontSize: 15,
              lineHeight: 1.45,
              resize: 'vertical',
            },
            note: { marginTop: 10, padding: 10, borderRadius: 8, background: '#f8fafc', color: '#64748b', fontSize: 12, lineHeight: 1.45 },
            error: { marginTop: 10, padding: 10, borderRadius: 8, background: '#fef2f2', color: '#991b1b', fontSize: 13 },
            actions: { display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) minmax(0, 2fr)', gap: 10, marginTop: 16 },
            secondaryButton: {
              minHeight: 48,
              padding: '10px 12px',
              border: '1px solid #cbd5e1',
              borderRadius: 9,
              background: '#ffffff',
              color: '#334155',
              fontWeight: 800,
            },
            primaryButton: {
              minHeight: 48,
              padding: '10px 12px',
              border: 0,
              borderRadius: 9,
              background: '#0f172a',
              color: '#ffffff',
              fontWeight: 800,
            },
          };
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('src/OwnerBookPage.tsx')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
            "import { useEffect, useMemo, useState } from 'react';\n",
            "import { useEffect, useMemo, useState } from 'react';\nimport { InviteSendDialog } from './InviteSendDialog.tsx';\n",
            1,
          )

          state_anchor = "  const [copiedPageId, setCopiedPageId] = useState<string | null>(null);\n"
          if state_anchor not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(
            state_anchor,
            state_anchor + "  const [inviteComposerPage, setInviteComposerPage] = useState<OwnerPage | null>(null);\n",
            1,
          )

          old_map = '''      setPages((current) =>\n        current.map((item) =>\n          item.id === page.id\n            ? {\n                ...item,\n                inviteToken: data.inviteToken,\n                inviteStatus:\n                  item.inviteStatus === 'empty' ? 'invited' : item.inviteStatus,\n              }\n            : item\n        )\n      );'''
          new_map = '''      const invitedPage: OwnerPage = {\n        ...page,\n        inviteToken: data.inviteToken,\n        inviteStatus: page.inviteStatus === 'empty' ? 'invited' : page.inviteStatus,\n      };\n\n      setPages((current) =>\n        current.map((item) => (item.id === page.id ? invitedPage : item))\n      );\n      setInviteComposerPage(invitedPage);'''
          if old_map not in text:
              raise SystemExit('createInvite map anchor not found')
          text = text.replace(old_map, new_map, 1)

          start = text.index('  const copyInvite = async (page: OwnerPage) => {')
          end = text.index('\n\n  const updateVisibility = async (', start)
          replacement = '''  const openInviteComposer = (page: OwnerPage) => {\n    if (!page.inviteToken) {\n      void createInvite(page);\n      return;\n    }\n\n    setInviteComposerPage(page);\n  };'''
          text = text[:start] + replacement + text[end:]

          old_render = '''                  ) : !hasInvite ? (\n                    <button\n                      type="button"\n                      onClick={() => createInvite(page)}\n                      disabled={isWorking}\n                      style={styles.primaryButton}\n                    >\n                      {isWorking ? 'Készül...' : 'Meghívó létrehozása'}\n                    </button>\n                  ) : (\n                    <>\n                      <div style={styles.inviteBox}>\n                        {origin}/p/{page.inviteToken}\n                      </div>\n                      <button\n                        type="button"\n                        onClick={() => copyInvite(page)}\n                        disabled={isWorking}\n                        style={styles.primaryButton}\n                      >\n                        {copiedPageId === page.id\n                          ? 'Meghívó üzenet kimásolva'\n                          : 'Meghívó üzenet másolása'}\n                      </button>\n                    </>\n                  )}'''
          new_render = '''                  ) : (\n                    <button\n                      type="button"\n                      onClick={() => openInviteComposer(page)}\n                      disabled={isWorking}\n                      style={styles.primaryButton}\n                    >\n                      {isWorking\n                        ? 'Készül...'\n                        : hasInvite\n                          ? 'Meghívás küldése'\n                          : 'Meghívás'}\n                    </button>\n                  )}'''
          if old_render not in text:
              raise SystemExit('invite render anchor not found')
          text = text.replace(old_render, new_render, 1)

          close_anchor = '''      </section>\n    </main>\n  );\n}'''
          modal = '''      </section>\n\n      {inviteComposerPage?.inviteToken && (\n        <InviteSendDialog\n          key={inviteComposerPage.inviteToken}\n          bookTitle={bookTitle}\n          pageNumber={inviteComposerPage.pageNumber}\n          pageUrl={`${origin}/p/${inviteComposerPage.inviteToken}`}\n          ctaUrl={`${origin}/nekem-is-kell`}\n          onClose={() => setInviteComposerPage(null)}\n        />\n      )}\n    </main>\n  );\n}'''
          if close_anchor not in text:
              raise SystemExit('render close anchor not found')
          text = text.replace(close_anchor, modal, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Build
        run: npm install && npm run build

      - name: Commit invitation send flow
        shell: bash
        run: |
          git config user.name "rauchlaszlo-blip"
          git config user.email "rauchlaszlo@gmail.com"
          git add src/OwnerBookPage.tsx src/InviteSendDialog.tsx
          git commit -m "Send invitations through native sharing"
          git push origin HEAD:main
