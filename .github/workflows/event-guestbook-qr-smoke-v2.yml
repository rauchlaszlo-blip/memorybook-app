name: Event Guestbook QR Smoke V2

on:
  push:
    branches:
      - mobile-guest-editor-smoke-2026-09-08
    paths:
      - .github/workflows/event-guestbook-qr-smoke-v2.yml

jobs:
  event-guestbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install @playwright/test@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run event guestbook QR test
        run: npx playwright test tests/event-guestbook-qr.spec.js --workers=1
