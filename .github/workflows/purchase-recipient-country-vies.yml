name: Purchase recipient country VIES
on:
  push:
    branches: [purchase-recipient-country-vies]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: purchase-recipient-country-vies
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply_purchase_recipient_country_vies.py
      - run: npm ci
      - run: npm run build
      - name: Verify purchase fixes
        run: |
          grep -q "giftRecipientEmail" src/PurchasePage.tsx
          grep -q "COUNTRY_CODES" src/PurchasePage.tsx
          grep -q "company-lookup" src/PurchasePage.tsx
          grep -q "GIFT_RECIPIENT_ACCOUNT_MISMATCH" server/index.ts
          grep -q "gift_recipient_email" server/migrations/20260909_gift_recipient.sql
          grep -q "taxation_customs/vies/rest-api/check-vat-number" server/index.ts
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PurchasePage.tsx src/publicUiI18n.ts src/GiftRedeemPage.tsx server/index.ts server/migrations/20260909_gift_recipient.sql
          git commit -m "Designate gift recipient and add company lookup"
          git push origin HEAD:purchase-recipient-country-vies
