name: Notification deeplink edit and check

on:
  push:
    branches:
      - notification-deeplink-2026-09-08

permissions:
  contents: write

jobs:
  edit-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: notification-deeplink-2026-09-08

      - name: Add notification page targeting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/OwnerBookPage.tsx')
          text = path.read_text(encoding='utf-8')

          origin_marker = "  const origin = useMemo(() => window.location.origin, []);\n"
          target_code = """  const targetPageId = useMemo(\n    () => new URLSearchParams(window.location.search).get('page'),\n    []\n  );\n"""
          if 'const targetPageId = useMemo' not in text:
              if origin_marker not in text:
                  raise SystemExit('Origin marker not found')
              text = text.replace(origin_marker, origin_marker + target_code, 1)

          load_effect_marker = "  }, [bookId]);\n\n  const createInvite"
          scroll_effect = """  }, [bookId]);\n\n  useEffect(() => {\n    if (loading || bookType !== 'standard' || !targetPageId) return;\n\n    const target = document.getElementById(`owner-page-${targetPageId}`);\n    if (!target) return;\n\n    const timer = window.setTimeout(() => {\n      target.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    }, 80);\n\n    return () => window.clearTimeout(timer);\n  }, [loading, bookType, pages, targetPageId]);\n\n  const createInvite"""
          if 'target.scrollIntoView' not in text:
              if load_effect_marker not in text:
                  raise SystemExit('Load effect marker not found')
              text = text.replace(load_effect_marker, scroll_effect, 1)

          article_marker = """                <article\n                  key={page.id}\n                  style={\n                    isArchived\n                      ? { ...styles.card, ...styles.archivedCard }\n                      : styles.card\n                  }\n                >"""
          article_replacement = """                <article\n                  key={page.id}\n                  id={`owner-page-${page.id}`}\n                  style={{\n                    ...styles.card,\n                    ...(isArchived ? styles.archivedCard : {}),\n                    ...(targetPageId === page.id ? styles.targetCard : {}),\n                  }}\n                >"""
          if 'id={`owner-page-${page.id}`}' not in text:
              if article_marker not in text:
                  raise SystemExit('Article marker not found')
              text = text.replace(article_marker, article_replacement, 1)

          archived_marker = """  archivedCard: {\n    background: '#f8fafc',\n    border: '1px dashed #94a3b8',\n  },\n"""
          target_style = """  archivedCard: {\n    background: '#f8fafc',\n    border: '1px dashed #94a3b8',\n  },\n  targetCard: {\n    outline: '3px solid #2563eb',\n    outlineOffset: 2,\n    boxShadow: '0 10px 28px rgba(37, 99, 235, 0.22)',\n  },\n"""
          if 'targetCard:' not in text:
              if archived_marker not in text:
                  raise SystemExit('Archived style marker not found')
              text = text.replace(archived_marker, target_style, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Remove temporary workflow and commit checked change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/notification-deeplink-edit.yml
          git add src/OwnerBookPage.tsx
          git commit -m "Support notification page deeplinks"
          git push origin HEAD:notification-deeplink-2026-09-08
