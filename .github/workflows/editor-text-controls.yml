name: Editor text controls

on:
  push:
    branches:
      - editor-text-controls

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-text-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/fix_editor_text_controls.py
      - run: npm ci
      - run: npm run build
      - name: Verify editor controls
        run: |
          grep -F "textSize: 'Szöveg mérete'" src/inviteEditorI18n.ts
          grep -F "moveText: 'Szöveg mozgatása'" src/inviteEditorI18n.ts
          grep -F "selectedTextFontSize" src/MemoryBookEditor.tsx
          grep -F "handleMoveSelectedText" src/MemoryBookEditor.tsx
          if grep -F "{copy.saveNow}" src/MemoryBookEditor.tsx; then echo "Manual save button still present"; exit 1; fi
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MemoryBookEditor.tsx src/inviteEditorI18n.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Improve editor text controls"
            git push origin HEAD:editor-text-controls
          fi
