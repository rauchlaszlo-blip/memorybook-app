name: Cleanup test-book grant
on:
  push:
    branches: [cleanup-test-book-grant]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-test-book-grant
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove one-time grant loader and migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/index.ts')
          text = p.read_text(encoding='utf-8')
          block = """  const testBookGrantMigration = await fs.readFile(
    path.join(process.cwd(), 'server', 'migrations', '20260909_grant_test_book_rauch.sql'),
    'utf8'
  );
  await pool.query(testBookGrantMigration);

"""
          if block not in text:
              raise SystemExit('test-book grant loader not found')
          p.write_text(text.replace(block, '', 1), encoding='utf-8')
          Path('server/migrations/20260909_grant_test_book_rauch.sql').unlink()
          PY
      - run: npm ci
      - run: npm run build
      - name: Verify cleanup
        run: |
          ! grep -q "grant_test_book_rauch" server/index.ts
          test ! -f server/migrations/20260909_grant_test_book_rauch.sql
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A server/index.ts server/migrations/20260909_grant_test_book_rauch.sql
          git commit -m "Remove one-time test book grant"
          git push origin HEAD:cleanup-test-book-grant
