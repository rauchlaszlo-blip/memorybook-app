name: Three purchase modes
on:
  push:
    branches: [three-purchase-modes]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: three-purchase-modes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add organization purchase mode
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Marker not found: {label}')
              return text.replace(old, new, 1)

          # Purchase page
          p = Path('src/PurchasePage.tsx')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              "type Mode = 'self' | 'gift';",
              "type Mode = 'self' | 'gift' | 'organization';",
              'Mode type')
          text = replace_once(text,
              "  const [mode, setMode] = useState<Mode>(initialQuery.get('mode') === 'gift' ? 'gift' : 'self');",
              """  const [mode, setMode] = useState<Mode>(\n    initialQuery.get('mode') === 'gift'\n      ? 'gift'\n      : initialQuery.get('mode') === 'organization'\n        ? 'organization'\n        : 'self'\n  );""",
              'initial mode')
          text = replace_once(text,
              """    if (mode === 'self' && !user) {\n      window.location.href = `/login?returnTo=${encodeURIComponent('/purchase?mode=self')}`;\n      return;\n    }""",
              """    if (mode !== 'gift' && !user) {\n      const returnTo = `/purchase?mode=${mode}`;\n      window.location.href = `/login?returnTo=${encodeURIComponent(returnTo)}`;\n      return;\n    }""",
              'submit auth')
          text = replace_once(text,
              """        <div style={styles.switcher}>\n          <button type=\"button\" onClick={() => setMode('self')} style={{ ...styles.switchButton, ...(mode === 'self' ? styles.active : {}) }}>{t('Magamnak')}</button>\n          <button type=\"button\" onClick={() => setMode('gift')} style={{ ...styles.switchButton, ...(mode === 'gift' ? styles.active : {}) }}>{t('Ajándékba')}</button>\n        </div>""",
              """        <div style={styles.switcher}>\n          <button type=\"button\" onClick={() => setMode('self')} style={{ ...styles.switchButton, ...(mode === 'self' ? styles.active : {}) }}>{t('Magamnak')}</button>\n          <button type=\"button\" onClick={() => setMode('gift')} style={{ ...styles.switchButton, ...(mode === 'gift' ? styles.active : {}) }}>{t('Ajándékba')}</button>\n          <button type=\"button\" onClick={() => setMode('organization')} style={{ ...styles.switchButton, ...(mode === 'organization' ? styles.active : {}) }}>{t('Cég / szervezet')}</button>\n        </div>""",
              'three mode switcher')
          text = replace_once(text,
              """        {mode === 'self' && !user && (\n          <div style={styles.notice}>\n            {t('Saját könyv vásárlásához előbb be kell lépned vagy regisztrálnod.')}\n            <a href={`/login?returnTo=${encodeURIComponent('/purchase?mode=self')}`} style={styles.inlineLink}> {t('Belépés / regisztráció')}</a>\n          </div>\n        )}""",
              """        {mode !== 'gift' && !user && (\n          <div style={styles.notice}>\n            {t('A vásárláshoz előbb be kell lépned vagy regisztrálnod.')}\n            <a href={`/login?returnTo=${encodeURIComponent(`/purchase?mode=${mode}`)}`} style={styles.inlineLink}> {t('Belépés / regisztráció')}</a>\n          </div>\n        )}""",
              'auth notice')
          text = replace_once(text,
              "          <button type=\"submit\" disabled={loading || (mode === 'self' && !user)} style={styles.primaryButton}>",
              "          <button type=\"submit\" disabled={loading || (mode !== 'gift' && !user)} style={styles.primaryButton}>",
              'submit disabled')
          text = replace_once(text,
              "  switcher: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4, marginBottom: 8, padding: 2, background: '#e2e8f0', borderRadius: 9 },",
              "  switcher: { display: 'grid', gridTemplateColumns: 'repeat(3,minmax(0,1fr))', gap: 4, marginBottom: 8, padding: 2, background: '#e2e8f0', borderRadius: 9 },",
              'switcher style')
          text = replace_once(text,
              "  switchButton: { minHeight: 38, border: 0, borderRadius: 7, background: 'transparent', fontWeight: 800, color: '#475569' },",
              "  switchButton: { minHeight: 38, padding: '0 2px', border: 0, borderRadius: 7, background: 'transparent', fontWeight: 800, color: '#475569', fontSize: 11.5, lineHeight: 1.15, whiteSpace: 'nowrap' },",
              'switch button style')
          p.write_text(text, encoding='utf-8')

          # Public translations
          p = Path('src/publicUiI18n.ts')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              "  'Ajándékba': { en: 'As a gift', de: 'Als Geschenk' },",
              "  'Ajándékba': { en: 'As a gift', de: 'Als Geschenk' },\n  'Cég / szervezet': { en: 'Company / organization', de: 'Firma / Organisation' },",
              'organization translation')
          text = replace_once(text,
              "  'Saját könyv vásárlásához előbb be kell lépned vagy regisztrálnod.': { en: 'To buy a book for yourself, sign in or register first.', de: 'Um ein Buch für dich selbst zu kaufen, musst du dich zuerst anmelden oder registrieren.' },",
              "  'Saját könyv vásárlásához előbb be kell lépned vagy regisztrálnod.': { en: 'To buy a book for yourself, sign in or register first.', de: 'Um ein Buch für dich selbst zu kaufen, musst du dich zuerst anmelden oder registrieren.' },\n  'A vásárláshoz előbb be kell lépned vagy regisztrálnod.': { en: 'Sign in or register before purchasing.', de: 'Melde dich vor dem Kauf an oder registriere dich.' },",
              'generic auth translation')
          p.write_text(text, encoding='utf-8')

          # Backend purchase mode support
          p = Path('server/index.ts')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              "  if (purchase.purchaseMode !== 'self') return;",
              "  if (purchase.purchaseMode === 'gift') return;",
              'payment access')
          text = replace_once(text,
              "      purchase_mode TEXT NOT NULL CHECK (purchase_mode IN ('self', 'gift')),","
              "      purchase_mode TEXT NOT NULL CHECK (purchase_mode IN ('self', 'gift', 'organization')),","
              'purchase check')
          text = replace_once(text,
              "  const purchaseMode = req.body?.purchaseMode === 'gift' ? 'gift' : 'self';",
              """  const purchaseMode =\n    req.body?.purchaseMode === 'gift'\n      ? 'gift'\n      : req.body?.purchaseMode === 'organization'\n        ? 'organization'\n        : 'self';""",
              'purchase mode parse')
          text = replace_once(text,
              "  if (purchaseMode === 'self' && !session) {",
              "  if (purchaseMode !== 'gift' && !session) {",
              'purchase auth')
          text = replace_once(text,
              "    purchaseMode === 'self'\n      ? String(session?.user?.name || req.body?.purchaserName || '').trim()",
              "    purchaseMode !== 'gift'\n      ? String(session?.user?.name || req.body?.purchaserName || '').trim()",
              'purchaser name')
          text = replace_once(text,
              "    purchaseMode === 'self'\n      ? String(session?.user?.email || req.body?.purchaserEmail || '').trim().toLowerCase()",
              "    purchaseMode !== 'gift'\n      ? String(session?.user?.email || req.body?.purchaserEmail || '').trim().toLowerCase()",
              'purchaser email')
          migration_marker = """  const billingProfilesMigration = await fs.readFile(\n    path.join(process.cwd(), 'server', 'migrations', '20260909_billing_profiles.sql'),\n    'utf8'\n  );\n  await pool.query(billingProfilesMigration);\n\n  const invoicingMigration = await fs.readFile("""
          migration_replacement = """  const billingProfilesMigration = await fs.readFile(\n    path.join(process.cwd(), 'server', 'migrations', '20260909_billing_profiles.sql'),\n    'utf8'\n  );\n  await pool.query(billingProfilesMigration);\n\n  const organizationPurchaseModeMigration = await fs.readFile(\n    path.join(process.cwd(), 'server', 'migrations', '20260909_organization_purchase_mode.sql'),\n    'utf8'\n  );\n  await pool.query(organizationPurchaseModeMigration);\n\n  const invoicingMigration = await fs.readFile("""
          text = replace_once(text, migration_marker, migration_replacement, 'organization migration load')
          p.write_text(text, encoding='utf-8')

          # Existing databases need the expanded CHECK constraint.
          migration = Path('server/migrations/20260909_organization_purchase_mode.sql')
          migration.write_text("""ALTER TABLE purchases\n  DROP CONSTRAINT IF EXISTS purchases_purchase_mode_check;\n\nALTER TABLE purchases\n  ADD CONSTRAINT purchases_purchase_mode_check\n  CHECK (purchase_mode IN ('self', 'gift', 'organization'));\n""", encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Verify changes
        run: |
          grep -q "Cég / szervezet" src/PurchasePage.tsx
          grep -q "repeat(3,minmax(0,1fr))" src/PurchasePage.tsx
          grep -q "organization" server/migrations/20260909_organization_purchase_mode.sql
          grep -q "purchaseMode === 'organization'" server/index.ts
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PurchasePage.tsx src/publicUiI18n.ts server/index.ts server/migrations/20260909_organization_purchase_mode.sql
          git commit -m "Add organization purchase choice"
          git push origin HEAD:three-purchase-modes
