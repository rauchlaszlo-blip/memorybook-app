name: Purchase tab wrap check
on:
  push:
    branches: [three-purchase-modes]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: three-purchase-modes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Allow long translated labels to wrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/PurchasePage.tsx')
          text = p.read_text(encoding='utf-8')
          old = "  switchButton: { minHeight: 38, padding: '0 2px', border: 0, borderRadius: 7, background: 'transparent', fontWeight: 800, color: '#475569', fontSize: 11.5, lineHeight: 1.15, whiteSpace: 'nowrap' },"
          new = "  switchButton: { minHeight: 38, padding: '2px', border: 0, borderRadius: 7, background: 'transparent', fontWeight: 800, color: '#475569', fontSize: 11.5, lineHeight: 1.15 },"
          if old not in text:
              raise SystemExit('switchButton marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PurchasePage.tsx
          git commit -m "Keep three purchase tabs responsive"
          git push origin HEAD:three-purchase-modes
