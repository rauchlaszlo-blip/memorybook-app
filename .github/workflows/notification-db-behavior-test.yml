name: Notification DB behavior test

on:
  push:
    branches:
      - notifications-foundation-2026-09-08

jobs:
  notification-db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memorybook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d memorybook_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: memorybook_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create minimal MemoryBook schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE users (
            id TEXT PRIMARY KEY
          );

          CREATE TABLE books (
            id TEXT PRIMARY KEY,
            owner_user_id TEXT NOT NULL REFERENCES users(id) ON DELETE RESTRICT,
            book_type TEXT NOT NULL DEFAULT 'standard'
          );

          CREATE TABLE contributions (
            id TEXT PRIMARY KEY,
            book_id TEXT NOT NULL REFERENCES books(id) ON DELETE CASCADE,
            owner_status TEXT NOT NULL DEFAULT 'pending',
            created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE pages (
            id TEXT PRIMARY KEY,
            book_id TEXT NOT NULL REFERENCES books(id) ON DELETE CASCADE,
            page_number INTEGER NOT NULL,
            invite_status TEXT NOT NULL DEFAULT 'empty',
            submitted_at TIMESTAMPTZ,
            invite_recipient_name TEXT,
            invite_recipient_email TEXT
          );
          SQL

      - name: Apply notification migration
        run: psql -v ON_ERROR_STOP=1 -f server/migrations/20260908_owner_notifications.sql

      - name: Verify notification behavior
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id) VALUES ('owner-1');

          INSERT INTO books (id, owner_user_id, book_type)
          VALUES
            ('book-standard', 'owner-1', 'standard'),
            ('book-event', 'owner-1', 'event');

          INSERT INTO pages (
            id, book_id, page_number, invite_status, invite_recipient_name
          )
          VALUES
            ('page-draft', 'book-standard', 1, 'draft', 'Bela'),
            ('page-standard-submit', 'book-standard', 2, 'draft', 'Anna'),
            ('page-event-submit', 'book-event', 1, 'draft', 'Festival Guest');

          -- Autosave/draft must not create a notification.
          UPDATE pages
          SET invite_status = 'draft'
          WHERE id = 'page-draft';

          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM notifications) <> 0 THEN
              RAISE EXCEPTION 'Draft/autosave created a notification';
            END IF;
          END;
          $$;

          -- Final standard page submission must create exactly one notification.
          UPDATE pages
          SET invite_status = 'submitted',
              submitted_at = CURRENT_TIMESTAMP
          WHERE id = 'page-standard-submit';

          DO $$
          DECLARE
            notification_count INTEGER;
            matched_count INTEGER;
          BEGIN
            SELECT COUNT(*) INTO notification_count FROM notifications;
            IF notification_count <> 1 THEN
              RAISE EXCEPTION 'Standard submit expected 1 notification, got %', notification_count;
            END IF;

            SELECT COUNT(*) INTO matched_count
            FROM notifications
            WHERE recipient_user_id = 'owner-1'
              AND book_id = 'book-standard'
              AND type = 'standard_page_submitted'
              AND source_page_id = 'page-standard-submit'
              AND actor_name = 'Anna'
              AND page_number = 2
              AND read_at IS NULL;

            IF matched_count <> 1 THEN
              RAISE EXCEPTION 'Standard submit notification payload mismatch';
            END IF;
          END;
          $$;

          -- Repeated update of an already submitted page must not duplicate it.
          UPDATE pages
          SET submitted_at = submitted_at
          WHERE id = 'page-standard-submit';

          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM notifications) <> 1 THEN
              RAISE EXCEPTION 'Already-submitted page created a duplicate notification';
            END IF;
          END;
          $$;

          -- Event book submissions must not create notification rows.
          UPDATE pages
          SET invite_status = 'submitted',
              submitted_at = CURRENT_TIMESTAMP
          WHERE id = 'page-event-submit';

          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM notifications) <> 1 THEN
              RAISE EXCEPTION 'Event book created a notification row';
            END IF;
          END;
          $$;

          -- Event badge source remains pending contributions, not notifications.
          INSERT INTO contributions (id, book_id, owner_status)
          VALUES
            ('contribution-1', 'book-event', 'pending'),
            ('contribution-2', 'book-event', 'pending'),
            ('contribution-3', 'book-event', 'kept');

          DO $$
          DECLARE
            pending_count INTEGER;
          BEGIN
            SELECT COUNT(*) INTO pending_count
            FROM contributions
            WHERE book_id = 'book-event'
              AND owner_status = 'pending';

            IF pending_count <> 2 THEN
              RAISE EXCEPTION 'Event pending badge count expected 2, got %', pending_count;
            END IF;

            IF to_regclass('public.contributions_book_pending_idx') IS NULL THEN
              RAISE EXCEPTION 'Pending contribution index is missing';
            END IF;
          END;
          $$;
          SQL
