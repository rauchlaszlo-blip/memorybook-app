name: Event Book Model Smoke
on:
  push:
    branches:
      - mobile-guest-editor-smoke-2026-09-08
    paths:
      - .github/workflows/event-book-model-smoke.yml
jobs:
  event-book-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install @playwright/test@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run event book model test
        run: npx playwright test tests/event-book-model.spec.js --workers=1
# rerun 2
