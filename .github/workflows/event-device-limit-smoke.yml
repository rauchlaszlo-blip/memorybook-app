name: Event Device Limit Smoke
on:
  push:
    branches:
      - event-device-limit-smoke-2026-09-08
    paths:
      - .github/workflows/event-device-limit-smoke.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install @playwright/test@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run device limit test
        run: npx playwright test tests/event-device-limit.spec.js --workers=1
