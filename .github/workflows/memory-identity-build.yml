name: Memory Identity Metadata Build

on:
  push:
    branches:
      - memory-identity-metadata-2026-09-08

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply memory identity patch
        run: python3 scripts/patch-memory-identity.py
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts src/InviteSendDialog.tsx src/OwnerBookPage.tsx src/BookViewerPage.tsx
          if git diff --cached --quiet; then
            echo "No app changes to commit"
          else
            git commit -m "Add persistent memory identity metadata"
            git push
          fi
