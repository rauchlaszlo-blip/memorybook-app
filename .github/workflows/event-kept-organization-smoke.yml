name: Event Kept Organization Smoke
on:
  push:
    branches:
      - event-kept-organization-smoke-2026-09-08
    paths:
      - .github/workflows/event-kept-organization-smoke.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install @playwright/test@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run kept organization test
        run: npx playwright test tests/event-kept-organization.spec.js --workers=1
