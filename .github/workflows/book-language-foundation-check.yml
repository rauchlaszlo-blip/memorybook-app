name: Book language foundation check

on:
  push:
    branches:
      - book-language-foundation-2026-09-08

permissions:
  contents: write

jobs:
  book-language-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memorybook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/memorybook_test
      BETTER_AUTH_URL: http://127.0.0.1:3001
      PORT: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: book-language-foundation-2026-09-08

      - name: Add book language backend and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('server/index.ts')
          text = server.read_text(encoding='utf-8')

          old = '''         b.title,\n         b.book_type AS "bookType",\n         b.created_at AS "createdAt",'''
          new = '''         b.title,\n         b.book_type AS "bookType",\n         b.language,\n         b.created_at AS "createdAt",'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''       GROUP BY b.id, b.title, b.book_type, b.created_at'''
          new = '''       GROUP BY b.id, b.title, b.book_type, b.language, b.created_at'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''  const entitlementId =\n    typeof req.body?.entitlementId === 'string' ? req.body.entitlementId.trim() : '';\n\n  if (!title || title.length > 120) {'''
          new = '''  const entitlementId =\n    typeof req.body?.entitlementId === 'string' ? req.body.entitlementId.trim() : '';\n  const language = req.body?.language === 'en' ? 'en' : 'hu';\n\n  if (!title || title.length > 120) {'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''      `INSERT INTO books (id, owner_user_id, title, invite_token, book_type, page_capacity)\n       VALUES ($1, $2, $3, $4, $5, $6)\n       RETURNING\n         id,\n         title,\n         book_type AS "bookType",\n         page_capacity AS "pageCapacity",\n         created_at AS "createdAt"`,\n      [bookId, session.user.id, title, inviteToken, bookType, includedPages]'''
          new = '''      `INSERT INTO books (id, owner_user_id, title, invite_token, book_type, page_capacity, language)\n       VALUES ($1, $2, $3, $4, $5, $6, $7)\n       RETURNING\n         id,\n         title,\n         book_type AS "bookType",\n         page_capacity AS "pageCapacity",\n         language,\n         created_at AS "createdAt"`,\n      [bookId, session.user.id, title, inviteToken, bookType, includedPages, language]'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'page_capacity, language' not in text:
              raise SystemExit('Book insert marker not found')

          old = '''app.get('/api/my/books/:bookId/event-settings', async (req, res) => {'''
          new = '''app.patch('/api/my/books/:bookId/language', async (req, res) => {\n  if (!auth) {\n    res.status(503).json({ error: 'AUTH_NOT_CONFIGURED' });\n    return;\n  }\n\n  const language = req.body?.language;\n  if (language !== 'hu' && language !== 'en') {\n    res.status(400).json({ error: 'INVALID_BOOK_LANGUAGE' });\n    return;\n  }\n\n  try {\n    const session = await getSession(req);\n    if (!session) {\n      res.status(401).json({ error: 'UNAUTHENTICATED' });\n      return;\n    }\n\n    const result = await pool.query(\n      `UPDATE books\n       SET language = $1,\n           updated_at = CURRENT_TIMESTAMP\n       WHERE id = $2\n         AND owner_user_id = $3\n       RETURNING id, language`,\n      [language, req.params.bookId, session.user.id]\n    );\n\n    if (result.rowCount === 0) {\n      res.status(404).json({ error: 'BOOK_NOT_FOUND' });\n      return;\n    }\n\n    res.status(200).json({ success: true, book: result.rows[0] });\n  } catch (err) {\n    console.error('Book language update error:', err);\n    res.status(500).json({ error: 'BOOK_LANGUAGE_UPDATE_FAILED' });\n  }\n});\n\napp.get('/api/my/books/:bookId/event-settings', async (req, res) => {'''
          if "app.patch('/api/my/books/:bookId/language'" not in text:
              if old not in text:
                  raise SystemExit('Event settings route marker not found')
              text = text.replace(old, new, 1)

          old = '''      `SELECT id, title, book_type AS "bookType", invite_token AS "eventInviteToken"\n       FROM books'''
          new = '''      `SELECT id, title, book_type AS "bookType", language, invite_token AS "eventInviteToken"\n       FROM books'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''  await pool.query(`ALTER TABLE books ADD COLUMN IF NOT EXISTS page_capacity INTEGER NOT NULL DEFAULT 30`);\n  await pool.query(`UPDATE books SET page_capacity = 0 WHERE book_type = 'event' AND page_capacity <> 0`);'''
          new = '''  await pool.query(`ALTER TABLE books ADD COLUMN IF NOT EXISTS page_capacity INTEGER NOT NULL DEFAULT 30`);\n  await pool.query(`ALTER TABLE books ADD COLUMN IF NOT EXISTS language TEXT NOT NULL DEFAULT 'hu'`);\n  await pool.query(`UPDATE books SET language = 'hu' WHERE language NOT IN ('hu', 'en') OR language IS NULL`);\n  await pool.query(`UPDATE books SET language = 'en' WHERE id = '${DEMO_BOOK_ID}'`);\n  await pool.query(`UPDATE books SET page_capacity = 0 WHERE book_type = 'event' AND page_capacity <> 0`);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'ADD COLUMN IF NOT EXISTS language TEXT' not in text:
              raise SystemExit('Books schema marker not found')

          server.write_text(text, encoding='utf-8')

          my_books = Path('src/MyBooksPage.tsx')
          text = my_books.read_text(encoding='utf-8')
          old = "import { LanguageSwitcher } from './LanguageSwitcher';\n"
          new = "import { LanguageSwitcher } from './LanguageSwitcher';\nimport { getAppLanguage, type AppLanguage } from './i18n';\n"
          if "getAppLanguage" not in text:
              text = text.replace(old, new, 1)
          old = '''  bookType?: 'standard' | 'event' | string;\n  createdAt: string;'''
          new = '''  bookType?: 'standard' | 'event' | string;\n  language?: AppLanguage;\n  createdAt: string;'''
          if old in text:
              text = text.replace(old, new, 1)
          old = '''        body: JSON.stringify({ title, entitlementId: selectedEntitlementId }),'''
          new = '''        body: JSON.stringify({\n          title,\n          entitlementId: selectedEntitlementId,\n          language: getAppLanguage(),\n        }),'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'language: getAppLanguage()' not in text:
              raise SystemExit('Book create body marker not found')
          my_books.write_text(text, encoding='utf-8')

          owner = Path('src/OwnerBookPage.tsx')
          text = owner.read_text(encoding='utf-8')
          old = "import { EventBookSettings } from './EventBookSettings.tsx';\n"
          new = "import { EventBookSettings } from './EventBookSettings.tsx';\nimport { SUPPORTED_APP_LANGUAGES, type AppLanguage } from './i18n';\n"
          if 'SUPPORTED_APP_LANGUAGES' not in text:
              text = text.replace(old, new, 1)

          old = '''  const [bookType, setBookType] = useState<'standard' | 'event'>('standard');\n  const [pages, setPages] = useState<OwnerPage[]>([]);'''
          new = '''  const [bookType, setBookType] = useState<'standard' | 'event'>('standard');\n  const [bookLanguage, setBookLanguage] = useState<AppLanguage>('hu');\n  const [languageSaving, setLanguageSaving] = useState(false);\n  const [pages, setPages] = useState<OwnerPage[]>([]);'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''        setBookType(data.book?.bookType === 'event' ? 'event' : 'standard');\n        setPages(Array.isArray(data.pages) ? data.pages : []);'''
          new = '''        setBookType(data.book?.bookType === 'event' ? 'event' : 'standard');\n        setBookLanguage(data.book?.language === 'en' ? 'en' : 'hu');\n        setPages(Array.isArray(data.pages) ? data.pages : []);'''
          if old in text:
              text = text.replace(old, new, 1)

          marker = '''  return (\n    <main style={styles.page}>'''
          updater = '''  const updateBookLanguage = async (language: AppLanguage) => {\n    try {\n      setLanguageSaving(true);\n      setError(null);\n      const response = await fetch(\n        `${API_BASE}/api/my/books/${encodeURIComponent(bookId)}/language`,\n        {\n          method: 'PATCH',\n          credentials: 'include',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ language }),\n        }\n      );\n\n      if (response.status === 401) {\n        window.location.href = '/login';\n        return;\n      }\n\n      const data = await response.json().catch(() => ({}));\n      if (!response.ok || !data.book?.language) {\n        throw new Error(data?.error || 'BOOK_LANGUAGE_UPDATE_FAILED');\n      }\n\n      setBookLanguage(data.book.language === 'en' ? 'en' : 'hu');\n    } catch (err) {\n      console.error(err);\n      setError('A könyv nyelvét nem sikerült módosítani.');\n    } finally {\n      setLanguageSaving(false);\n    }\n  };\n\n  return (\n    <main style={styles.page}>'''
          if 'const updateBookLanguage = async' not in text:
              if marker not in text:
                  raise SystemExit('Owner return marker not found')
              text = text.replace(marker, updater, 1)

          old = '''            <h1 style={styles.title}>{bookTitle}</h1>\n            <p style={styles.subtitle}>'''
          new = '''            <h1 style={styles.title}>{bookTitle}</h1>\n            <label style={styles.bookLanguageLabel}>\n              Könyv nyelve\n              <select\n                value={bookLanguage}\n                onChange={(event) => void updateBookLanguage(event.target.value as AppLanguage)}\n                disabled={languageSaving}\n                style={styles.bookLanguageSelect}\n                aria-label="Könyv nyelve"\n              >\n                {SUPPORTED_APP_LANGUAGES.map((item) => (\n                  <option key={item.code} value={item.code}>{item.label}</option>\n                ))}\n              </select>\n            </label>\n            <p style={styles.subtitle}>'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'aria-label="Könyv nyelve"' not in text:
              raise SystemExit('Owner title marker not found')

          style_marker = '''  subtitle: {'''
          style_insert = '''  bookLanguageLabel: {\n    display: 'flex',\n    alignItems: 'center',\n    gap: 8,\n    flexWrap: 'wrap',\n    marginTop: 10,\n    fontSize: 14,\n    fontWeight: 700,\n    color: '#475569',\n  },\n  bookLanguageSelect: {\n    minHeight: 40,\n    padding: '7px 9px',\n    border: '1px solid #cbd5e1',\n    borderRadius: 8,\n    background: '#ffffff',\n    color: '#334155',\n    fontWeight: 700,\n  },\n  subtitle: {'''
          if 'bookLanguageLabel:' not in text:
              if style_marker not in text:
                  raise SystemExit('Owner subtitle style marker not found')
              text = text.replace(style_marker, style_insert, 1)

          owner.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Backend TypeScript check
        run: npx tsc --noEmit --ignoreConfig --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --allowSyntheticDefaultImports --skipLibCheck server/index.ts server/db.ts server/auth.ts

      - name: Start backend
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          npx tsx server/index.ts > /tmp/memorybook-backend.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-backend.log
          exit 1

      - name: Test book language API
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const { Pool } = require('pg');
          const crypto = require('crypto');

          (async () => {
            const base = 'http://127.0.0.1:3001';
            const email = `book-language-${crypto.randomUUID()}@example.test`;
            const password = crypto.randomBytes(18).toString('base64url');
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            try {
              const signup = await context.request.post(`${base}/api/auth/sign-up/email`, {
                headers: { Origin: base },
                data: { name: 'Book Language Owner', email, password },
              });
              if (!signup.ok()) throw new Error(`Signup failed: ${signup.status()} ${await signup.text()}`);

              const user = await pool.query('SELECT id FROM users WHERE email = $1', [email]);
              if (user.rowCount !== 1) throw new Error('User missing');
              const userId = user.rows[0].id;

              const purchaseId = `purchase-${crypto.randomUUID()}`;
              const entitlementId = `entitlement-${crypto.randomUUID()}`;
              await pool.query(
                `INSERT INTO purchases (
                   id, purchase_mode, book_type, included_pages, purchaser_user_id,
                   purchaser_name, purchaser_email, billing_name, billing_email,
                   billing_country, billing_postal_code, billing_city, billing_address,
                   payment_provider, payment_status
                 ) VALUES ($1, 'self', 'standard', 30, $2, 'Owner', $3, 'Owner', $3,
                           'HU', '1000', 'Budapest', 'Test', 'paypal', 'paid')`,
                [purchaseId, userId, email]
              );
              await pool.query(
                `INSERT INTO book_entitlements (
                   id, purchase_id, assigned_user_id, book_type, included_pages, status
                 ) VALUES ($1, $2, $3, 'standard', 30, 'available')`,
                [entitlementId, purchaseId, userId]
              );

              const create = await context.request.post(`${base}/api/my/books`, {
                data: { title: 'English Book', entitlementId, language: 'en' },
              });
              if (create.status() !== 201) throw new Error(`Create failed: ${create.status()} ${await create.text()}`);
              const created = await create.json();
              if (created.book?.language !== 'en') throw new Error(`Created language mismatch: ${JSON.stringify(created)}`);

              const list = await context.request.get(`${base}/api/my/books`);
              if (!list.ok()) throw new Error(`List failed: ${list.status()}`);
              const listData = await list.json();
              const listed = listData.books.find((item) => item.id === created.book.id);
              if (listed?.language !== 'en') throw new Error(`List language mismatch: ${JSON.stringify(listed)}`);

              const pages = await context.request.get(`${base}/api/my/books/${created.book.id}/pages`);
              if (!pages.ok()) throw new Error(`Pages failed: ${pages.status()}`);
              const pagesData = await pages.json();
              if (pagesData.book?.language !== 'en') throw new Error(`Owner book language mismatch: ${JSON.stringify(pagesData.book)}`);

              const update = await context.request.patch(`${base}/api/my/books/${created.book.id}/language`, {
                data: { language: 'hu' },
              });
              if (!update.ok()) throw new Error(`Language update failed: ${update.status()} ${await update.text()}`);
              const updateData = await update.json();
              if (updateData.book?.language !== 'hu') throw new Error(`Updated language mismatch: ${JSON.stringify(updateData)}`);

              const invalid = await context.request.patch(`${base}/api/my/books/${created.book.id}/language`, {
                data: { language: 'fr' },
              });
              if (invalid.status() !== 400) throw new Error(`Invalid language should be 400, got ${invalid.status()}`);

              const dbBook = await pool.query('SELECT language FROM books WHERE id = $1', [created.book.id]);
              if (dbBook.rows[0]?.language !== 'hu') throw new Error(`DB language mismatch: ${JSON.stringify(dbBook.rows[0])}`);

              console.log('BOOK_LANGUAGE_API_PASS');
            } finally {
              await context.close();
              await browser.close();
              await pool.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Start frontend preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/memorybook-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-preview.log
          exit 1

      - name: Test book language UI
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            let createBody = null;
            let patchBody = null;

            await page.addInitScript(() => localStorage.setItem('memorybook.appLanguage', 'en'));
            await page.route('http://127.0.0.1:3001/api/**', async (route) => {
              const req = route.request();
              const path = new URL(req.url()).pathname;
              const cors = {
                'access-control-allow-origin': 'http://127.0.0.1:4173',
                'access-control-allow-credentials': 'true',
                'access-control-allow-methods': 'GET,POST,PATCH,OPTIONS',
                'access-control-allow-headers': 'content-type',
              };
              if (req.method() === 'OPTIONS') return route.fulfill({ status: 204, headers: cors, body: '' });
              const json = (body, status = 200) => route.fulfill({ status, headers: { ...cors, 'content-type': 'application/json' }, body: JSON.stringify(body) });

              if (path === '/api/me') return json({ user: { id: 'u1', name: 'Owner', email: 'o@example.test' } });
              if (path === '/api/my/books' && req.method() === 'GET') return json({ books: [] });
              if (path === '/api/my/entitlements') return json({ entitlements: [{ id: 'e1', bookType: 'standard', includedPages: 30, status: 'available' }] });
              if (path === '/api/my/notifications/unread-count') return json({ unreadCount: 0 });
              if (path === '/api/my/books' && req.method() === 'POST') {
                createBody = req.postDataJSON();
                return json({ success: true, book: { id: 'book-ui', title: createBody.title, bookType: 'standard', language: createBody.language, pageCount: 30, contributionCount: 0, createdAt: '2026-09-08T18:00:00Z' } }, 201);
              }
              if (path === '/api/my/books/book-ui/pages') return json({ book: { id: 'book-ui', title: 'UI Book', bookType: 'standard', language: 'hu', eventInviteToken: null }, pages: [] });
              if (path === '/api/my/books/book-ui/language' && req.method() === 'PATCH') {
                patchBody = req.postDataJSON();
                return json({ success: true, book: { id: 'book-ui', language: patchBody.language } });
              }
              return json({ error: 'UNEXPECTED', path, method: req.method() }, 500);
            });

            try {
              await page.goto('http://127.0.0.1:4173/my-books');
              await page.waitForLoadState('networkidle');
              await page.getByPlaceholder('Például: Anna 40. születésnapja').fill('New English Book');
              await page.getByRole('button', { name: /Létrehoz/ }).click();
              if (createBody?.language !== 'en') throw new Error(`New book did not use app language: ${JSON.stringify(createBody)}`);

              await page.goto('http://127.0.0.1:4173/my-books/book-ui');
              const languageSelect = page.getByLabel('Könyv nyelve');
              await languageSelect.waitFor({ state: 'visible' });
              if (await languageSelect.inputValue() !== 'hu') throw new Error('Book language did not load independently');
              await languageSelect.selectOption('en');
              await page.waitForTimeout(100);
              if (patchBody?.language !== 'en') throw new Error(`Book language PATCH mismatch: ${JSON.stringify(patchBody)}`);
              if (localStorage === undefined) {}
              console.log('BOOK_LANGUAGE_UI_PASS');
            } finally {
              await context.close();
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit checked source changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/book-language-foundation-check.yml
          git add server/index.ts src/MyBooksPage.tsx src/OwnerBookPage.tsx
          git commit -m "Add per-book language foundation"
          git push origin HEAD:book-language-foundation-2026-09-08

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/memorybook-backend.log || true
          cat /tmp/memorybook-preview.log || true
