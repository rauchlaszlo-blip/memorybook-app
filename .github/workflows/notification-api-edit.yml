name: Notification API edit and check

on:
  push:
    branches:
      - notifications-api-2026-09-08

permissions:
  contents: write

jobs:
  edit-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: notifications-api-2026-09-08

      - name: Insert notification API routes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/index.ts')
          text = path.read_text(encoding='utf-8')
          marker = "\napp.get('/api/my/books', async (req, res) => {"
          if "/api/my/notifications" in text:
              raise SystemExit('Notification API routes already exist')
          if marker not in text:
              raise SystemExit('Insertion marker not found')

          routes = r'''

app.get('/api/my/notifications', async (req, res) => {
  if (!auth) {
    res.status(503).json({ error: 'AUTH_NOT_CONFIGURED' });
    return;
  }

  try {
    const session = await getSession(req);
    if (!session) {
      res.status(401).json({ error: 'UNAUTHENTICATED' });
      return;
    }

    const requestedLimit = Number(req.query.limit ?? 50);
    const limit = Number.isInteger(requestedLimit)
      ? Math.min(100, Math.max(1, requestedLimit))
      : 50;

    const [notificationsResult, unreadResult] = await Promise.all([
      pool.query(
        `SELECT
           n.id,
           n.type,
           n.book_id AS "bookId",
           b.title AS "bookTitle",
           n.source_page_id AS "pageId",
           n.actor_name AS "actorName",
           n.page_number AS "pageNumber",
           n.read_at AS "readAt",
           n.created_at AS "createdAt",
           '/my-books/' || n.book_id || '?page=' || n.source_page_id AS "targetPath"
         FROM notifications n
         JOIN books b ON b.id = n.book_id
         WHERE n.recipient_user_id = $1
         ORDER BY n.created_at DESC, n.id DESC
         LIMIT $2`,
        [session.user.id, limit]
      ),
      pool.query(
        `SELECT COUNT(*)::int AS count
         FROM notifications
         WHERE recipient_user_id = $1
           AND read_at IS NULL`,
        [session.user.id]
      ),
    ]);

    res.status(200).json({
      notifications: notificationsResult.rows,
      unreadCount: Number(unreadResult.rows[0]?.count || 0),
    });
  } catch (err) {
    console.error('Notification list error:', err);
    res.status(500).json({ error: 'NOTIFICATION_LIST_FAILED' });
  }
});

app.get('/api/my/notifications/unread-count', async (req, res) => {
  if (!auth) {
    res.status(503).json({ error: 'AUTH_NOT_CONFIGURED' });
    return;
  }

  try {
    const session = await getSession(req);
    if (!session) {
      res.status(401).json({ error: 'UNAUTHENTICATED' });
      return;
    }

    const result = await pool.query(
      `SELECT COUNT(*)::int AS count
       FROM notifications
       WHERE recipient_user_id = $1
         AND read_at IS NULL`,
      [session.user.id]
    );

    res.status(200).json({ unreadCount: Number(result.rows[0]?.count || 0) });
  } catch (err) {
    console.error('Notification unread count error:', err);
    res.status(500).json({ error: 'NOTIFICATION_UNREAD_COUNT_FAILED' });
  }
});

app.patch('/api/my/notifications/:notificationId/read', async (req, res) => {
  if (!auth) {
    res.status(503).json({ error: 'AUTH_NOT_CONFIGURED' });
    return;
  }

  try {
    const session = await getSession(req);
    if (!session) {
      res.status(401).json({ error: 'UNAUTHENTICATED' });
      return;
    }

    const result = await pool.query(
      `UPDATE notifications
       SET read_at = COALESCE(read_at, CURRENT_TIMESTAMP)
       WHERE id = $1
         AND recipient_user_id = $2
       RETURNING id, read_at AS "readAt"`,
      [req.params.notificationId, session.user.id]
    );

    if (result.rowCount === 0) {
      res.status(404).json({ error: 'NOTIFICATION_NOT_FOUND' });
      return;
    }

    const unreadResult = await pool.query(
      `SELECT COUNT(*)::int AS count
       FROM notifications
       WHERE recipient_user_id = $1
         AND read_at IS NULL`,
      [session.user.id]
    );

    res.status(200).json({
      success: true,
      notification: result.rows[0],
      unreadCount: Number(unreadResult.rows[0]?.count || 0),
    });
  } catch (err) {
    console.error('Notification read-state error:', err);
    res.status(500).json({ error: 'NOTIFICATION_READ_STATE_FAILED' });
  }
});
'''

          path.write_text(text.replace(marker, routes + marker, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Server TypeScript check
        run: npx tsc --ignoreConfig --noEmit --module ESNext --moduleResolution Bundler --target ES2022 --esModuleInterop --skipLibCheck server/index.ts server/auth.ts server/db.ts

      - name: Remove temporary workflow and commit checked change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/notification-api-edit.yml
          git add server/index.ts
          git commit -m "Add owner notification API"
          git push origin HEAD:notifications-api-2026-09-08
