name: Invoicing foundation check

on:
  push:
    branches:
      - invoicing-foundation-2026-09-08

permissions:
  contents: write

jobs:
  invoicing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memorybook_invoicing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memorybook_invoicing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/memorybook_invoicing
      BETTER_AUTH_SECRET: regression-regression-regression-regression
      BETTER_AUTH_URL: http://127.0.0.1:3001
      PORT: 3001

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: invoicing-foundation-2026-09-08

      - name: Patch backend integration points
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/index.ts')
          s = p.read_text(encoding='utf-8')

          old = "import { pool } from './db';\n"
          new = old + "import { getInvoicingCapabilities } from './invoicing';\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = """app.get('/api/auth-capabilities', (_req, res) => {\n  res.status(200).json({\n    google: Boolean(process.env.GOOGLE_CLIENT_ID) && Boolean(process.env.GOOGLE_CLIENT_SECRET),\n  });\n});\n"""
          new = old + """\napp.get('/api/invoicing-capabilities', (_req, res) => {\n  res.status(200).json(getInvoicingCapabilities());\n});\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = """  await pool.query(`\n    CREATE TABLE IF NOT EXISTS book_entitlements (\n"""
          new = """  const invoicingMigration = await fs.readFile(\n    path.join(process.cwd(), 'server', 'migrations', '20260908_invoicing_foundation.sql'),\n    'utf8'\n  );\n  await pool.query(invoicingMigration);\n\n""" + old
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = "console.log('Users, books, contributions, pages, notifications and owner page controls ready.');"
          new = "console.log('Users, books, contributions, pages, notifications, invoices and owner page controls ready.');"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Backend TypeScript check
        run: npx tsc --noEmit --ignoreConfig --target ES2022 --module ESNext --moduleResolution Bundler --esModuleInterop --allowSyntheticDefaultImports --skipLibCheck --noImplicitAny false server/index.ts server/db.ts server/auth.ts server/invoicing.ts

      - name: Start backend
        run: |
          npx tsx server/index.ts > /tmp/memorybook-backend.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/invoicing-capabilities >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-backend.log
          exit 1

      - name: Run invoicing integration tests
        run: |
          mkdir -p .tmp-tests
          cat > .tmp-tests/invoicing-check.ts <<'TS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import { pool } from '../server/db';
          import { getInvoicingCapabilities, prepareInvoiceForPaidPurchase } from '../server/invoicing';

          const capabilityResponse = await fetch('http://127.0.0.1:3001/api/invoicing-capabilities');
          assert.equal(capabilityResponse.status, 200);
          const publicCapabilities: any = await capabilityResponse.json();
          assert.deepEqual(publicCapabilities.supportedProviders, ['billingo', 'szamlazzhu']);
          assert.equal(publicCapabilities.provider, null);
          assert.equal(publicCapabilities.liveIssuingEnabled, false);
          assert.ok(publicCapabilities.missingConfiguration.includes('INVOICE_PROVIDER'));

          const localCapabilities = getInvoicingCapabilities();
          assert.equal(localCapabilities.adapterConnected, false);
          assert.equal(localCapabilities.liveIssuingRequested, false);

          const purchaseId = `purchase-invoice-${crypto.randomUUID()}`;
          await pool.query(
            `INSERT INTO purchases (
               id, purchase_mode, book_type, included_pages,
               purchaser_name, purchaser_email,
               billing_name, billing_email, billing_country, billing_country_code,
               billing_postal_code, billing_city, billing_address, billing_tax_number,
               payment_provider, payment_status, provider_reference,
               amount_minor, currency, paid_at, invoice_language, invoice_tax_code
             ) VALUES (
               $1, 'self', 'standard', 30,
               'Invoice Test', 'invoice@example.com',
               'Invoice Test', 'invoice@example.com', 'Magyarország', 'HU',
               '8900', 'Zalaegerszeg', 'Teszt utca 1.', NULL,
               'simplepay', 'paid', 'simplepay-test-ref',
               4990, 'HUF', CURRENT_TIMESTAMP, 'de', 'AAM'
             )`,
            [purchaseId]
          );

          const first = await prepareInvoiceForPaidPurchase(purchaseId);
          assert.equal(first.invoice.status, 'prepared');
          assert.equal(first.invoice.purchaseId, purchaseId);
          assert.equal(first.invoice.payload.language, 'de');
          assert.equal(first.invoice.payload.buyer.countryCode, 'HU');
          assert.equal(first.invoice.payload.totalGrossMinor, 4990);
          assert.equal(first.invoice.payload.currency, 'HUF');
          assert.equal(first.invoice.payload.items[0].sku, 'MEMORYBOOK_STANDARD_30');
          assert.equal(first.invoice.payload.items[0].taxCode, 'AAM');
          assert.equal(first.liveReady, false, 'no provider adapter is connected yet');
          assert.deepEqual(first.missingInvoiceData, []);

          const second = await prepareInvoiceForPaidPurchase(purchaseId);
          assert.equal(second.invoice.id, first.invoice.id, 'invoice preparation must be idempotent');
          const count = await pool.query('SELECT COUNT(*)::int AS count FROM purchase_invoices WHERE purchase_id = $1', [purchaseId]);
          assert.equal(count.rows[0].count, 1);

          const unpaidId = `purchase-unpaid-${crypto.randomUUID()}`;
          await pool.query(
            `INSERT INTO purchases (
               id, purchase_mode, book_type, included_pages,
               purchaser_name, purchaser_email,
               billing_name, billing_email, billing_country,
               billing_postal_code, billing_city, billing_address,
               payment_provider, payment_status, amount_minor, currency
             ) VALUES (
               $1, 'gift', 'event', 0,
               'Unpaid Test', 'unpaid@example.com',
               'Unpaid Test', 'unpaid@example.com', 'Hungary',
               '8900', 'Zalaegerszeg', 'Teszt utca 2.',
               'paypal', 'draft', 4990, 'HUF'
             )`,
            [unpaidId]
          );
          await assert.rejects(
            () => prepareInvoiceForPaidPurchase(unpaidId),
            (error: any) => error?.message === 'INVOICE_REQUIRES_PAID_PURCHASE'
          );

          const noAmountId = `purchase-noamount-${crypto.randomUUID()}`;
          await pool.query(
            `INSERT INTO purchases (
               id, purchase_mode, book_type, included_pages,
               purchaser_name, purchaser_email,
               billing_name, billing_email, billing_country,
               billing_postal_code, billing_city, billing_address,
               payment_provider, payment_status, paid_at
             ) VALUES (
               $1, 'gift', 'event', 0,
               'No Amount Test', 'noamount@example.com',
               'No Amount Test', 'noamount@example.com', 'Hungary',
               '8900', 'Zalaegerszeg', 'Teszt utca 3.',
               'paypal', 'paid', CURRENT_TIMESTAMP
             )`,
            [noAmountId]
          );
          await assert.rejects(
            () => prepareInvoiceForPaidPurchase(noAmountId),
            (error: any) => error?.message === 'INVOICE_AMOUNT_NOT_READY'
          );

          const schema = await pool.query(
            `SELECT column_name FROM information_schema.columns
             WHERE table_schema = 'public' AND table_name = 'purchase_invoices'`
          );
          const columns = new Set(schema.rows.map((row: any) => row.column_name));
          for (const required of ['purchase_id', 'provider', 'status', 'payload_json', 'invoice_number', 'attempt_count']) {
            assert.ok(columns.has(required), `missing invoice column ${required}`);
          }

          console.log('INVOICING_FOUNDATION_PASS');
          await pool.end();
          TS
          npx tsx .tmp-tests/invoicing-check.ts
          rm -rf .tmp-tests

      - name: Commit verified source and remove temporary workflow
        run: |
          rm .github/workflows/invoicing-foundation-check.yml
          git config user.name "rauchlaszlo-blip"
          git config user.email "rauchlaszlo@gmail.com"
          git add server/index.ts .github/workflows/invoicing-foundation-check.yml
          git commit -m "Wire invoicing foundation into backend"
          git push origin HEAD:invoicing-foundation-2026-09-08
