name: Notification UI edit and check

on:
  push:
    branches:
      - notifications-ui-2026-09-08

permissions:
  contents: write

jobs:
  edit-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: notifications-ui-2026-09-08

      - name: Insert notification menu into owner header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/MyBooksPage.tsx')
          text = path.read_text(encoding='utf-8')

          import_marker = "import type { FormEvent } from 'react';\n"
          if "./NotificationMenu" not in text:
              if import_marker not in text:
                  raise SystemExit('Import marker not found')
              text = text.replace(
                  import_marker,
                  import_marker + "import { NotificationMenu } from './NotificationMenu';\n",
                  1,
              )

          old_button = '          <button type="button" onClick={signOut} style={styles.secondaryButton}>Kijelentkezés</button>'
          new_buttons = '''          <div style={styles.headerActions}>
            <NotificationMenu />
            <button type="button" onClick={signOut} style={styles.secondaryButton}>Kijelentkezés</button>
          </div>'''
          if old_button not in text:
              raise SystemExit('Header button marker not found')
          text = text.replace(old_button, new_buttons, 1)

          old_header = "  header: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, marginBottom: 24 },"
          new_header = "  header: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, marginBottom: 24, flexWrap: 'wrap' },\n  headerActions: { display: 'flex', alignItems: 'center', gap: 8, marginLeft: 'auto' },"
          if old_header not in text:
              raise SystemExit('Header style marker not found')
          text = text.replace(old_header, new_header, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Remove temporary workflow and commit checked change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/notification-ui-edit.yml
          git add src/MyBooksPage.tsx src/NotificationMenu.tsx
          git commit -m "Add owner notification menu"
          git push origin HEAD:notifications-ui-2026-09-08
