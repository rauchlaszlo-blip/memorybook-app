name: Remove how button check

on:
  push:
    branches:
      - remove-how-button

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[remove-how-button]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove secondary how-it-works button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/LandingPage.tsx')
          text = p.read_text(encoding='utf-8')
          target = '          <a href="#how" style={styles.secondaryButton}>{copy.howTitle}</a>\n'
          if text.count(target) != 1:
              raise SystemExit(f'expected exactly one button, found {text.count(target)}')
          p.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Verify scoped change
        run: |
          ! grep -F 'href="#how"' src/LandingPage.tsx
          grep -F '<h2 style={styles.sectionTitle}>{copy.howTitle}</h2>' src/LandingPage.tsx
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/remove-how-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove landing how-it-works button [remove-how-button]"
          git push origin HEAD:remove-how-button
