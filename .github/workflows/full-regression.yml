name: MemoryBook full regression

on:
  push:
    branches:
      - full-regression-2026-09-08

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memorybook_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memorybook_regression"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/memorybook_regression
      BETTER_AUTH_SECRET: regression-only-secret-2026-09-08-very-long-value
      BETTER_AUTH_URL: http://127.0.0.1:3001
      PORT: 3001

    steps:
      - name: Checkout regression branch
        uses: actions/checkout@v4
        with:
          ref: full-regression-2026-09-08

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Backend TypeScript check
        run: npx tsc --noEmit --ignoreConfig --target ES2022 --module ESNext --moduleResolution Bundler --esModuleInterop --allowSyntheticDefaultImports --skipLibCheck --noImplicitAny false server/index.ts server/db.ts server/auth.ts

      - name: Start backend
        run: |
          npx tsx server/index.ts > /tmp/memorybook-backend.log 2>&1 &
          echo $! > /tmp/memorybook-backend.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/auth-capabilities >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-backend.log
          exit 1

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/memorybook-preview.log 2>&1 &
          echo $! > /tmp/memorybook-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-preview.log
          exit 1

      - name: Run full regression
        run: node scripts/full-regression.mjs

      - name: Show logs on failure
        if: failure()
        run: |
          echo '--- BACKEND LOG ---'
          cat /tmp/memorybook-backend.log 2>/dev/null || true
          echo '--- PREVIEW LOG ---'
          cat /tmp/memorybook-preview.log 2>/dev/null || true
