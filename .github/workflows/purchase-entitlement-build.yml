name: Purchase Entitlement Foundation Build

on:
  push:
    branches:
      - purchase-entitlement-foundation-2026-09-08-v2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply purchase entitlement patch
        run: python3 scripts/patch-purchase-entitlements.py
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts src/MyBooksPage.tsx src/PurchasePage.tsx src/GiftRedeemPage.tsx src/AuthPage.tsx src/main.tsx
          if git diff --cached --quiet; then
            echo "No app changes to commit"
          else
            git commit -m "Add purchase entitlement foundation"
            git push
          fi
