name: SimplePay HTTP UI wiring

on:
  push:
    branches:
      - simplepay-http-ui-wiring

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[simplepay-wiring-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped wiring patch
        run: python3 scripts/apply-simplepay-http-ui-wiring.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Backend TypeScript check
        run: npx tsc --ignoreConfig --noEmit --target ES2023 --module ESNext --moduleResolution Bundler --types node --skipLibCheck server/index.ts server/db.ts server/payments/paypal.ts server/payments/paypal-purchase.ts server/payments/simplepay.ts server/payments/simplepay-purchase.ts
      - name: Verify SimplePay route safety anchors
        run: |
          grep -F "pathname === '/api/payments/simplepay/ipn'" server/index.ts
          grep -F "buildSimplePayIpnAcknowledgement(rawBody, incomingSignature)" server/index.ts
          grep -F "finalizeSimplePayPurchaseFromIpn(acknowledgement.message)" server/index.ts
          grep -F "paymentStatus === 'paid'" src/PurchasePage.tsx
          grep -F "simplepay/status" src/PurchasePage.tsx
          grep -F "simplepay/start" src/PurchasePage.tsx
      - name: Verify scoped diff
        run: git diff --check
      - name: Remove temporary patch machinery
        run: rm scripts/apply-simplepay-http-ui-wiring.py .github/workflows/simplepay-http-ui-wiring.yml
      - name: Commit verified wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire SimplePay HTTP routes and purchase UI [simplepay-wiring-applied]"
          git push origin HEAD:simplepay-http-ui-wiring
