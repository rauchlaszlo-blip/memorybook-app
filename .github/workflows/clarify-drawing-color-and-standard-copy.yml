name: Clarify drawing color and standard copy

on:
  push:
    branches:
      - clarify-drawing-color-and-standard-copy

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clarify-drawing-color-and-standard-copy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/clarify_drawing_color_and_standard_copy.py
      - run: npm ci
      - run: npm run build
      - name: Verify requested changes
        run: |
          grep -F "<span>{copy.brushColor}</span>" src/MemoryBookEditor.tsx
          grep -F "megszerkeszti és visszaküldi neked" src/LandingPage.tsx
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MemoryBookEditor.tsx src/LandingPage.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Clarify drawing color selector and standard book copy"
            git push origin HEAD:clarify-drawing-color-and-standard-copy
          fi
