name: Google Auth Readiness Build

on:
  push:
    branches:
      - google-auth-readiness-2026-09-08

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply readiness patch
        run: python3 scripts/patch-google-auth-readiness.py
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts src/AuthPage.tsx
          git diff --cached --quiet || git commit -m "Handle Google OAuth readiness"
          git push
