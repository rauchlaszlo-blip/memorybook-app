name: Text transform handles

on:
  push:
    branches:
      - text-transform-handles

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: text-transform-handles
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/fix_text_transform_handles.py
      - run: npm ci
      - run: npm run build
      - name: Verify text transform behavior
        run: |
          grep -F "cornerSize: 20" src/MemoryBookEditor.tsx
          grep -F "setControlsVisibility" src/MemoryBookEditor.tsx
          grep -F "object:moving" src/MemoryBookEditor.tsx
          grep -F "keepTextInsideCanvas" src/MemoryBookEditor.tsx
          grep -F "hasSelection ? 'none' : 'manipulation'" src/MemoryBookEditor.tsx
          if grep -F "selectedTextFontSize" src/MemoryBookEditor.tsx; then echo "Old text size slider remains"; exit 1; fi
          if grep -F "handleMoveSelectedText" src/MemoryBookEditor.tsx; then echo "Old move button remains"; exit 1; fi
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MemoryBookEditor.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Use direct text transform handles"
            git push origin HEAD:text-transform-handles
          fi
