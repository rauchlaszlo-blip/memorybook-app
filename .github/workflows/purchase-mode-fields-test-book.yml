name: Purchase mode fields and test book
on:
  push:
    branches: [purchase-mode-fields-test-book]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: purchase-mode-fields-test-book
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply_purchase_mode_fields.py
      - run: npm ci
      - run: npm run build
      - name: Verify changes
        run: |
          grep -q "billingCompanyName" src/PurchasePage.tsx
          grep -q "Kapcsolattartó" src/PurchasePage.tsx
          grep -q "Közösségi adószám / VAT ID" src/PurchasePage.tsx
          grep -q "ACCOUNT_REQUIRED_FOR_PURCHASE" server/index.ts
          grep -q "billing_company_name" server/migrations/20260909_company_billing.sql
          grep -q "test-book-rauchlaszlo-20260909" server/migrations/20260909_grant_test_book_rauch.sql
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PurchasePage.tsx src/publicUiI18n.ts server/index.ts server/migrations/20260909_company_billing.sql server/migrations/20260909_grant_test_book_rauch.sql
          git commit -m "Tailor gift and company purchase fields"
          git push origin HEAD:purchase-mode-fields-test-book
