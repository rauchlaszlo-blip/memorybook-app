name: Invite Resend Expiry Smoke
on:
  push:
    branches:
      - invite-resend-expiry-smoke-2026-09-08
    paths:
      - .github/workflows/invite-resend-expiry-smoke.yml
      - tests/invite-resend-expiry.spec.js
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install @playwright/test@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run invite resend and expiry test
        run: npx playwright test tests/invite-resend-expiry.spec.js --workers=1
