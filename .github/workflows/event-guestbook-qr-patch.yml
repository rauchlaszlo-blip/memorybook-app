          s = s.replace("  const [bookTitle, setBookTitle] = useState('MemoryBook');", "  const [bookTitle, setBookTitle] = useState('MemoryBook');\n  const [eventInviteToken, setEventInviteToken] = useState<string | null>(null);")
          s = s.replace("        setBookTitle(data.book?.title || 'MemoryBook');", "        setBookTitle(data.book?.title || 'MemoryBook');\n        setEventInviteToken(data.book?.eventInviteToken || null);")

          marker = "      <section style={styles.panel}>"
          panel = '''      {eventInviteToken && (\n        <section style={styles.eventPanel}>\n          <div>\n            <strong style={styles.eventPanelTitle}>Rendezvény vendégkönyv</strong>\n            <div style={styles.eventPanelText}>\n              Egy közös QR-kódot tehetsz ki a helyszínen. Minden vendég ugyanabba a vendégkönyvbe írhat.\n            </div>\n          </div>\n          <a\n            href={`/my-books/${encodeURIComponent(bookId)}/event-qr`}\n            style={styles.eventQrButton}\n          >\n            QR-kód megnyitása\n          </a>\n        </section>\n      )}\n\n'''
