name: Notification UI browser test

on:
  push:
    branches:
      - notification-deeplink-2026-09-08

jobs:
  notification-ui-browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: notification-deeplink-2026-09-08

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/memorybook-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-preview.log
          exit 1

      - name: Run mobile notification flow
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            let unreadCount = 1;

            await page.route('http://127.0.0.1:3001/api/**', async (route) => {
              const request = route.request();
              const url = new URL(request.url());
              const path = url.pathname;

              const json = (body, status = 200) => route.fulfill({
                status,
                contentType: 'application/json',
                body: JSON.stringify(body),
              });

              if (path === '/api/me') {
                return json({ user: { id: 'user-ui-test', name: 'UI Owner', email: 'ui@example.test' } });
              }
              if (path === '/api/my/books') {
                return json({ books: [{
                  id: 'book-ui-test',
                  title: 'UI tesztkönyv',
                  bookType: 'standard',
                  pageCount: 1,
                  contributionCount: 0,
                  createdAt: '2026-09-08T18:00:00Z',
                }] });
              }
              if (path === '/api/my/entitlements') {
                return json({ entitlements: [] });
              }
              if (path === '/api/my/notifications/unread-count') {
                return json({ unreadCount });
              }
              if (path === '/api/my/notifications' && request.method() === 'GET') {
                return json({
                  unreadCount,
                  notifications: [{
                    id: 'notification-ui-test',
                    type: 'standard_page_submitted',
                    bookId: 'book-ui-test',
                    bookTitle: 'UI tesztkönyv',
                    pageId: 'page-ui-test',
                    actorName: 'UI Guest',
                    pageNumber: 7,
                    readAt: null,
                    createdAt: '2026-09-08T18:00:00Z',
                    targetPath: '/my-books/book-ui-test?page=page-ui-test',
                  }],
                });
              }
              if (path === '/api/my/notifications/notification-ui-test/read' && request.method() === 'PATCH') {
                unreadCount = 0;
                return json({ success: true, notification: { id: 'notification-ui-test', readAt: '2026-09-08T18:01:00Z' }, unreadCount });
              }
              if (path === '/api/my/books/book-ui-test/pages') {
                return json({
                  book: { id: 'book-ui-test', title: 'UI tesztkönyv', bookType: 'standard', eventInviteToken: null },
                  pages: [{
                    id: 'page-ui-test',
                    pageNumber: 7,
                    version: 1,
                    inviteStatus: 'submitted',
                    ownerVisibility: 'active',
                    submittedAt: '2026-09-08T18:00:00Z',
                    inviteRecipientName: 'UI Guest',
                    authorShareApproved: false,
                    ownerShareApproved: false,
                  }],
                });
              }

              return json({ error: 'UNEXPECTED_TEST_REQUEST', path, method: request.method() }, 500);
            });

            try {
              await page.goto('http://127.0.0.1:4173/my-books');
              await page.waitForLoadState('networkidle');

              const bell = page.locator('button[aria-label*="1 olvasatlan"]');
              await bell.waitFor({ state: 'visible', timeout: 10000 });
              await bell.click();

              const region = page.getByRole('region', { name: 'Értesítések' });
              await region.waitFor({ state: 'visible' });
              const regionBox = await region.boundingBox();
              if (!regionBox) throw new Error('Notification panel has no bounding box');
              if (regionBox.x < -1 || regionBox.x + regionBox.width > 391) {
                throw new Error(`Notification panel overflows mobile viewport: ${JSON.stringify(regionBox)}`);
              }

              const notificationButton = region
                .getByRole('button')
                .filter({ hasText: 'UI Guest visszaküldte a 7. oldalt.' });
              await notificationButton.waitFor({ state: 'visible' });
              await notificationButton.click();

              await page.waitForURL('http://127.0.0.1:4173/my-books/book-ui-test?page=page-ui-test', { timeout: 10000 });
              const targetCard = page.locator('#owner-page-page-ui-test');
              await targetCard.waitFor({ state: 'visible', timeout: 10000 });
              await page.waitForTimeout(250);

              const targetStyle = await targetCard.evaluate((element) => {
                const style = window.getComputedStyle(element);
                return { outlineStyle: style.outlineStyle, outlineWidth: style.outlineWidth };
              });
              if (targetStyle.outlineStyle === 'none' || targetStyle.outlineWidth === '0px') {
                throw new Error(`Target card was not highlighted: ${JSON.stringify(targetStyle)}`);
              }

              const targetBox = await targetCard.boundingBox();
              if (!targetBox || targetBox.y >= 844 || targetBox.y + targetBox.height <= 0) {
                throw new Error(`Target card was not scrolled into view: ${JSON.stringify(targetBox)}`);
              }
              if (unreadCount !== 0) {
                throw new Error(`Unread count should be 0 after opening notification, got ${unreadCount}`);
              }

              console.log('NOTIFICATION_UI_BROWSER_PASS');
            } finally {
              await context.close();
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/memorybook-preview.log || true
