name: PayPal HTTP UI recheck

on:
  push:
    branches:
      - paypal-http-ui-wiring

permissions:
  contents: write

jobs:
  harden-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paypal-http-ui-wiring
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply callback and public URL hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          purchase_path = Path('src/PurchasePage.tsx')
          purchase = purchase_path.read_text(encoding='utf-8')
          purchase = replace_once(
              purchase,
              "import { useEffect, useState } from 'react';",
              "import { useCallback, useEffect, useState } from 'react';",
              'React imports',
          )
          purchase = replace_once(
              purchase,
              "  const t = (key: string) => publicText(language, key);",
              "  const t = useCallback((key: string) => publicText(language, key), [language]);",
              'translation callback',
          )
          purchase_path.write_text(purchase, encoding='utf-8')

          index_path = Path('server/index.ts')
          index = index_path.read_text(encoding='utf-8')
          old_helper = """function getPublicAppBaseUrl(req: any): string {
            const configured = String(process.env.PUBLIC_APP_URL || '').trim().replace(/\\/+$/, '');
            if (configured) {
              try {
                const parsed = new URL(configured);
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                  return parsed.toString().replace(/\\/+$/, '');
                }
              } catch {
                throw new PayPalPurchaseError('INVALID_PUBLIC_APP_URL', 500);
              }
            }

            const forwardedProto = String(req.headers?.['x-forwarded-proto'] || '')
              .split(',')[0]
              .trim()
              .toLowerCase();
            const protocol = forwardedProto === 'https' ? 'https' : 'http';
            const host = String(req.get?.('host') || '').trim();
            if (!host) {
              throw new PayPalPurchaseError('PUBLIC_APP_URL_NOT_AVAILABLE', 500);
            }
            return `${protocol}://${host}`;
          }
          """
          new_helper = """function getPublicAppBaseUrl(req: any): string {
            const configured = String(
              process.env.PUBLIC_APP_URL || process.env.RENDER_EXTERNAL_URL || ''
            ).trim().replace(/\\/+$/, '');
            if (configured) {
              try {
                const parsed = new URL(configured);
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                  return parsed.toString().replace(/\\/+$/, '');
                }
              } catch {
                throw new PayPalPurchaseError('INVALID_PUBLIC_APP_URL', 500);
              }
            }

            const host = String(req.get?.('host') || '').trim();
            const hostname = host.split(':')[0].toLowerCase();
            if (!host || (hostname !== 'localhost' && hostname !== '127.0.0.1')) {
              throw new PayPalPurchaseError('PUBLIC_APP_URL_NOT_AVAILABLE', 503);
            }
            return `http://${host}`;
          }
          """
          index = replace_once(index, old_helper, new_helper, 'public app URL helper')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Frontend production build
        run: npm run build

      - name: Backend TypeScript check
        run: npx tsc --ignoreConfig --noEmit --target ES2023 --module ESNext --moduleResolution Bundler --skipLibCheck --noImplicitAny false server/index.ts server/payments/paypal.ts server/payments/paypal-purchase.ts

      - name: Verify scoped diff
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit tested hardening and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/paypal-http-ui-recheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts src/PurchasePage.tsx .github/workflows/paypal-http-ui-recheck.yml
          git commit -m "Harden PayPal return flow [skip ci]"
          git push origin HEAD:paypal-http-ui-wiring
