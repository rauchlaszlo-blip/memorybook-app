name: German language foundation check

on:
  push:
    branches:
      - german-language-foundation-2026-09-08

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memorybook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/memorybook_test
      BETTER_AUTH_SECRET: german-language-check-secret
      BETTER_AUTH_URL: http://127.0.0.1:3001
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: german-language-foundation-2026-09-08

      - name: Apply German language changes
        run: python scripts/add-german-language.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Backend TypeScript check
        run: npx tsc --ignoreConfig --noEmit --module ESNext --moduleResolution Bundler --target ES2022 --esModuleInterop --skipLibCheck server/index.ts server/auth.ts server/db.ts

      - name: Start backend
        run: |
          npx tsx server/index.ts > /tmp/memorybook-backend.log 2>&1 &
          echo $! > /tmp/memorybook-backend.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-backend.log
          exit 1

      - name: Test German backend acceptance
        run: node scripts/test-german-backend.mjs

      - name: Restart backend and verify German persistence
        run: |
          kill $(cat /tmp/memorybook-backend.pid)
          sleep 1
          npx tsx server/index.ts > /tmp/memorybook-backend-restart.log 2>&1 &
          echo $! > /tmp/memorybook-backend.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              node scripts/test-german-backend.mjs --persistence-only
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-backend-restart.log
          exit 1

      - name: Start Vite preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/memorybook-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-preview.log
          exit 1

      - name: Test German mobile UI
        run: node scripts/test-german-ui.cjs

      - name: Commit checked source changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/german-language-foundation-check.yml
          git rm scripts/add-german-language.py scripts/test-german-backend.mjs scripts/test-german-ui.cjs
          git add server/index.ts src/i18n.ts src/LanguageSwitcher.tsx src/inviteEditorI18n.ts src/PageInviteEditorPage.tsx src/InviteSendDialog.tsx src/OwnerBookPage.tsx
          git commit -m "Add German language foundation"
          git push origin HEAD:german-language-foundation-2026-09-08

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/memorybook-backend.log 2>/dev/null || true
          cat /tmp/memorybook-backend-restart.log 2>/dev/null || true
          cat /tmp/memorybook-preview.log 2>/dev/null || true
