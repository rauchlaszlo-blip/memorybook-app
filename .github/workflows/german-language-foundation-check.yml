name: German language foundation check

on:
  push:
    branches:
      - german-language-foundation-2026-09-08

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memorybook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/memorybook_test
      BETTER_AUTH_SECRET: german-language-check-secret
      BETTER_AUTH_URL: http://127.0.0.1:3001
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: german-language-foundation-2026-09-08

      - name: Add German language support
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Marker not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # i18n.ts
          p = Path('src/i18n.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("export type AppLanguage = 'hu' | 'en';", "export type AppLanguage = 'hu' | 'en' | 'de';")
          text = text.replace("  { code: 'en', label: 'English' },\n];", "  { code: 'en', label: 'English' },\n  { code: 'de', label: 'Deutsch' },\n];")
          text = text.replace("  return normalized === 'hu' || normalized === 'en' ? normalized : null;", "  return normalized === 'hu' || normalized === 'en' || normalized === 'de'\n    ? normalized\n    : null;")
          p.write_text(text, encoding='utf-8')

          # LanguageSwitcher.tsx
          replace_once(
              'src/LanguageSwitcher.tsx',
              "      aria-label={language === 'hu' ? 'Alkalmazás nyelve' : 'Application language'}",
              "      aria-label={\n        language === 'hu'\n          ? 'Alkalmazás nyelve'\n          : language === 'de'\n            ? 'Anwendungssprache'\n            : 'Application language'\n      }"
          )

          # PageInviteEditorPage.tsx
          replace_once(
              'src/PageInviteEditorPage.tsx',
              "import { detectBrowserAppLanguage, type AppLanguage } from './i18n';",
              "import { detectBrowserAppLanguage, normalizeAppLanguage, type AppLanguage } from './i18n';"
          )
          replace_once(
              'src/PageInviteEditorPage.tsx',
              "  const language: AppLanguage =\n    page?.language === 'en' ? 'en' : page?.language === 'hu' ? 'hu' : fallbackLanguage;",
              "  const language: AppLanguage = normalizeAppLanguage(page?.language) ?? fallbackLanguage;"
          )
          replace_once(
              'src/PageInviteEditorPage.tsx',
              "          language: data?.language === 'hu' ? 'hu' : 'en',",
              "          language: normalizeAppLanguage(data?.language) ?? fallbackLanguage,"
          )

          # inviteEditorI18n.ts
          p = Path('src/inviteEditorI18n.ts')
          text = p.read_text(encoding='utf-8')
          marker = "\n  },\n} as const;\n"
          idx = text.rfind(marker)
          if idx < 0:
              raise SystemExit('inviteEditorI18n closing marker not found')
          de_block = r'''
  },
  de: {
    page: {
      loading: 'Einladung wird geladen...',
      alreadySubmitted: 'Diese Seite wurde bereits eingereicht und kann nicht mehr bearbeitet werden.',
      unavailable: 'Diese Einladung ist nicht verfügbar.',
      notFound: 'Einladung nicht gefunden.',
      confirmSubmit: 'Nach dem Einreichen kannst du diese Seite nicht mehr bearbeiten. Möchtest du sie wirklich einreichen?',
      conflict: 'Diese Seite wurde zwischenzeitlich geändert. Lade die Seite neu und versuche es erneut.',
      submitFailed: 'Das Einreichen ist fehlgeschlagen. Deine Bearbeitung wurde noch nicht geschlossen.',
      success: 'Deine Seite wurde eingereicht. Vielen Dank!',
      submittedLocked: 'Die eingereichte Seite kann über diese Einladung nicht mehr bearbeitet werden.',
      shareApproved: 'Du hast der öffentlichen Freigabe zugestimmt. Die Seite wird nur öffentlich, wenn auch der Eigentümer des Buches zustimmt.',
      shareDenied: 'Du hast der öffentlichen Freigabe nicht zugestimmt.',
      pageLabel: (pageNumber: number) => `Deine Seite: Seite ${pageNumber}`,
      instructions: 'Mit dieser Einladung kannst du nur diese eine Seite bearbeiten. Deine Änderungen werden automatisch gespeichert.',
      shareConsentAria: 'Öffentliche Freigabe erlauben',
      shareConsent: 'Ich stimme zu, dass diese Seite öffentlich geteilt werden darf. Für die öffentliche Freigabe ist zusätzlich die Zustimmung des Buch-Eigentümers erforderlich.',
      submitting: 'Wird eingereicht...',
      submit: 'Seite einreichen',
      submitWarning: 'Nach dem Einreichen wird diese Seite für dich endgültig gesperrt.',
    },
    editor: {
      textPlaceholder: 'Schreibe hier deine Gedanken...',
      addText: '+ Text',
      addPhoto: '+ Foto',
      startDrawing: 'Freihand zeichnen',
      stopDrawing: 'Zeichnen beenden',
      eraser: 'Radierer',
      stopEraser: 'Radierer beenden',
      brushColor: 'Pinselfarbe',
      brushWidth: 'Pinselbreite',
      bringForward: '↑ Nach vorne',
      sendBackward: '↓ Nach hinten',
      delete: 'Löschen',
      undo: 'Rückgängig',
      redo: 'Wiederholen',
      saved: '✓ Gespeichert',
      saving: 'Speichern...',
      conflict: '⚠ Konflikt',
      unsaved: 'Nicht gespeichert',
      saveNow: 'Jetzt speichern',
    },
'''
          text = text[:idx] + '\n' + de_block + text[idx + len("\n  },") :]
          p.write_text(text, encoding='utf-8')

          # InviteSendDialog.tsx
          replace_once(
              'src/InviteSendDialog.tsx',
              "function languageLabel(language: AppLanguage) {\n  return language === 'en' ? 'English' : 'Magyar';\n}",
              "function languageLabel(language: AppLanguage) {\n  if (language === 'de') return 'Deutsch';\n  return language === 'en' ? 'English' : 'Magyar';\n}"
          )
          replace_once(
              'src/InviteSendDialog.tsx',
              "function buildGreeting(language: AppLanguage, recipientName: string) {\n  const name = recipientName.trim();\n  if (language === 'en') return name ? `Hi, ${name}!` : 'Hi!';\n  return name ? `Szia, ${name}!` : 'Szia!';\n}",
              "function buildGreeting(language: AppLanguage, recipientName: string) {\n  const name = recipientName.trim();\n  if (language === 'de') return name ? `Hallo, ${name}!` : 'Hallo!';\n  if (language === 'en') return name ? `Hi, ${name}!` : 'Hi!';\n  return name ? `Szia, ${name}!` : 'Szia!';\n}\n\nfunction buildInviteTitle(language: AppLanguage, bookTitle: string) {\n  if (language === 'de') return `MemoryBook-Einladung – ${bookTitle}`;\n  if (language === 'en') return `MemoryBook invitation – ${bookTitle}`;\n  return `MemoryBook meghívás – ${bookTitle}`;\n}"
          )
          replace_once(
              'src/InviteSendDialog.tsx',
              "  if (language === 'en') {\n    return [",
              "  if (language === 'de') {\n    return [\n      buildGreeting(language, recipientName),\n      '',\n      `Ich habe ein MemoryBook mit dem Titel „${bookTitle}“ erstellt. Ich würde mich freuen, wenn du eine eigene Seite dafür gestaltest.`,\n      '',\n      'Deine Seite findest du hier:',\n      pageUrl,\n      '',\n      'Dieser Link gehört nur zu deiner Seite. Wenn du fertig bist, reiche sie unten auf der Seite ein.',\n      'Die Einladung ist 14 Tage gültig.',\n      '',\n      `👉 Eigenes MemoryBook erstellen: ${ctaUrl}`,\n    ].join('\\n');\n  }\n\n  if (language === 'en') {\n    return ["
          )
          p = Path('src/InviteSendDialog.tsx')
          text = p.read_text(encoding='utf-8')
          old_subject = """        const subject =
          effectiveInviteLanguage === 'en'
            ? `MemoryBook invitation – ${bookTitle}`
            : `MemoryBook meghívás – ${bookTitle}`;"""
          if old_subject not in text:
              raise SystemExit('Invite email subject marker missing')
          text = text.replace(old_subject, "        const subject = buildInviteTitle(effectiveInviteLanguage, bookTitle);", 1)
          old_share = """        title:
          effectiveInviteLanguage === 'en'
            ? `MemoryBook invitation – ${bookTitle}`
            : `MemoryBook meghívás – ${bookTitle}`,"""
          if old_share not in text:
              raise SystemExit('Invite share title marker missing')
          text = text.replace(old_share, "        title: buildInviteTitle(effectiveInviteLanguage, bookTitle),", 1)
          text = text.replace("            <option value=\"en\">English</option>\n", "            <option value=\"en\">English</option>\n            <option value=\"de\">Deutsch</option>\n", 1)
          p.write_text(text, encoding='utf-8')

          # OwnerBookPage.tsx
          replace_once(
              'src/OwnerBookPage.tsx',
              "import { SUPPORTED_APP_LANGUAGES, type AppLanguage } from './i18n';",
              "import { normalizeAppLanguage, SUPPORTED_APP_LANGUAGES, type AppLanguage } from './i18n';"
          )
          replace_once(
              'src/OwnerBookPage.tsx',
              "        setBookLanguage(data.book?.language === 'en' ? 'en' : 'hu');",
              "        setBookLanguage(normalizeAppLanguage(data.book?.language) ?? 'hu');"
          )
          replace_once(
              'src/OwnerBookPage.tsx',
              "      inviteLanguage:\n        data.inviteLanguage === 'en'\n          ? 'en'\n          : data.inviteLanguage === 'hu'\n            ? 'hu'\n            : null,",
              "      inviteLanguage: normalizeAppLanguage(data.inviteLanguage),"
          )
          replace_once(
              'src/OwnerBookPage.tsx',
              "      setBookLanguage(data.book.language === 'en' ? 'en' : 'hu');",
              "      setBookLanguage(normalizeAppLanguage(data.book.language) ?? 'hu');"
          )

          # server/index.ts
          p = Path('server/index.ts')
          text = p.read_text(encoding='utf-8')
          old = """    requestedLanguage !== 'hu' &&
    requestedLanguage !== 'en'"""
          new = """    requestedLanguage !== 'hu' &&
    requestedLanguage !== 'en' &&
    requestedLanguage !== 'de'"""
          count = text.count(old)
          if count < 1:
              raise SystemExit('requestedLanguage validation marker missing')
          text = text.replace(old, new)
          old = "const language = requestedLanguage === 'en' ? 'en' : 'hu';"
          if old not in text:
              raise SystemExit('requestedLanguage normalization marker missing')
          text = text.replace(old, "const language = requestedLanguage === 'de' ? 'de' : requestedLanguage === 'en' ? 'en' : 'hu';")
          old = "if (language !== 'hu' && language !== 'en') {"
          if old not in text:
              raise SystemExit('book language PATCH validation marker missing')
          text = text.replace(old, "if (language !== 'hu' && language !== 'en' && language !== 'de') {")
          old = "rawInviteLanguage === 'hu' || rawInviteLanguage === 'en'"
          if old not in text:
              raise SystemExit('invite language validation marker missing')
          text = text.replace(old, "rawInviteLanguage === 'hu' || rawInviteLanguage === 'en' || rawInviteLanguage === 'de'")
          text = text.replace("language NOT IN ('hu', 'en')", "language NOT IN ('hu', 'en', 'de')")
          text = text.replace("invite_language NOT IN ('hu', 'en')", "invite_language NOT IN ('hu', 'en', 'de')")
          p.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Backend TypeScript check
        run: npx tsc --ignoreConfig --noEmit --module ESNext --moduleResolution Bundler --target ES2022 --esModuleInterop --skipLibCheck server/index.ts server/auth.ts server/db.ts

      - name: Start backend
        run: |
          npx tsx server/index.ts > /tmp/memorybook-backend.log 2>&1 &
          echo $! > /tmp/memorybook-backend.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-backend.log
          exit 1

      - name: Test German backend acceptance and persistence
        run: |
          node <<'NODE'
          const { Pool } = require('pg');
          const base = 'http://127.0.0.1:3001';
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: { 'content-type': 'application/json', ...(options.headers || {}) },
            });
            const data = await response.json().catch(() => ({}));
            return { response, data };
          }

          (async () => {
            let r = await request('/api/my/books/test/language', {
              method: 'PATCH', body: JSON.stringify({ language: 'de' })
            });
            if (r.data.error === 'INVALID_BOOK_LANGUAGE') throw new Error('Backend rejected de book language');
            r = await request('/api/my/books/test/language', {
              method: 'PATCH', body: JSON.stringify({ language: 'fr' })
            });
            if (r.response.status !== 400 || r.data.error !== 'INVALID_BOOK_LANGUAGE') {
              throw new Error(`fr book language should be rejected: ${r.response.status} ${JSON.stringify(r.data)}`);
            }

            r = await request('/api/my/books/test/pages/test/invite/sent', {
              method: 'POST',
              body: JSON.stringify({ recipientName: 'Anna', recipientEmail: '', deliveryMethod: 'share', inviteLanguage: 'de' })
            });
            if (r.data.error === 'INVALID_INVITE_LANGUAGE') throw new Error('Backend rejected de invite language');
            r = await request('/api/my/books/test/pages/test/invite/sent', {
              method: 'POST',
              body: JSON.stringify({ recipientName: 'Anna', recipientEmail: '', deliveryMethod: 'share', inviteLanguage: 'fr' })
            });
            if (r.response.status !== 400 || r.data.error !== 'INVALID_INVITE_LANGUAGE') {
              throw new Error(`fr invite language should be rejected: ${r.response.status} ${JSON.stringify(r.data)}`);
            }

            await pool.query("INSERT INTO users (id, display_name) VALUES ('de-user', 'Deutsch Test')");
            await pool.query("INSERT INTO books (id, owner_user_id, title, invite_token, book_type, language) VALUES ('de-book', 'de-user', 'Deutsches Buch', 'de-book-token', 'standard', 'de')");
            await pool.query("INSERT INTO pages (id, book_id, page_number, invite_status, invite_token, invite_language) VALUES ('de-page', 'de-book', 1, 'invited', 'de-page-token', 'de')");

            const before = await pool.query("SELECT b.language, p.invite_language FROM books b JOIN pages p ON p.book_id=b.id WHERE b.id='de-book'");
            if (before.rows[0]?.language !== 'de' || before.rows[0]?.invite_language !== 'de') {
              throw new Error('German values were not stored before restart');
            }

            console.log('GERMAN_BACKEND_ACCEPTANCE_PASS');
            await pool.end();
          })().catch(async (error) => {
            console.error(error);
            await pool.end().catch(() => {});
            process.exit(1);
          });
          NODE

          kill $(cat /tmp/memorybook-backend.pid)
          sleep 1
          npx tsx server/index.ts > /tmp/memorybook-backend-restart.log 2>&1 &
          echo $! > /tmp/memorybook-backend.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const { Pool } = require('pg');
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          (async () => {
            const result = await pool.query("SELECT b.language, p.invite_language FROM books b JOIN pages p ON p.book_id=b.id WHERE b.id='de-book'");
            const row = result.rows[0];
            if (row?.language !== 'de' || row?.invite_language !== 'de') {
              throw new Error(`German values did not survive startup: ${JSON.stringify(row)}`);
            }
            console.log('GERMAN_STARTUP_PERSISTENCE_PASS');
            await pool.end();
          })().catch(async (error) => {
            console.error(error);
            await pool.end().catch(() => {});
            process.exit(1);
          });
          NODE

      - name: Start Vite preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/memorybook-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memorybook-preview.log
          exit 1

      - name: Test German UI on mobile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              locale: 'de-DE',
            });
            const page = await context.newPage();

            await page.route('http://127.0.0.1:3001/api/**', async (route) => {
              const req = route.request();
              const url = new URL(req.url());
              const path = url.pathname;
              const cors = {
                'access-control-allow-origin': 'http://127.0.0.1:4173',
                'access-control-allow-credentials': 'true',
                'access-control-allow-methods': 'GET,POST,PATCH,OPTIONS',
                'access-control-allow-headers': 'content-type',
              };
              if (req.method() === 'OPTIONS') return route.fulfill({ status: 204, headers: cors, body: '' });
              const json = (body, status = 200) => route.fulfill({ status, headers: { ...cors, 'content-type': 'application/json' }, body: JSON.stringify(body) });

              if (path === '/api/me') return json({ user: { id: 'u1', name: 'Deutsch Owner', email: 'owner@example.test' } });
              if (path === '/api/my/books') return json({ books: [{ id: 'book-de', title: 'Deutsches Buch', bookType: 'standard', language: 'de', pageCount: 1, contributionCount: 0, createdAt: '2026-09-08T20:00:00Z' }] });
              if (path === '/api/my/entitlements') return json({ entitlements: [] });
              if (path === '/api/my/notifications/unread-count') return json({ unreadCount: 0 });
              if (path === '/api/my/books/book-de/pages') return json({
                book: { id: 'book-de', title: 'Deutsches Buch', bookType: 'standard', language: 'de', eventInviteToken: null },
                pages: [{ id: 'page-de', pageNumber: 7, version: 1, inviteStatus: 'invited', inviteToken: 'token-de', inviteCreatedAt: '2026-09-08T20:00:00Z', inviteExpiresAt: '2026-09-22T20:00:00Z', inviteSentAt: null, inviteRecipientName: null, inviteRecipientEmail: null, inviteDeliveryMethod: null, inviteLanguage: null, ownerVisibility: 'active', authorShareApproved: false, ownerShareApproved: false }],
              });
              if (path === '/api/page-invites/token-de' && req.method() === 'GET') return json({
                id: 'page-de', bookId: 'book-de', bookTitle: 'Deutsches Buch', pageNumber: 7, version: 1, inviteStatus: 'invited', language: 'de', canvasData: {}, previewImageUrl: null,
              });
              return json({ error: 'UNEXPECTED_TEST_REQUEST', path, method: req.method() }, 500);
            });

            try {
              await page.goto('http://127.0.0.1:4173/my-books');
              await page.waitForLoadState('networkidle');
              const appLanguage = page.getByRole('combobox', { name: 'Anwendungssprache' });
              await appLanguage.waitFor({ state: 'visible' });
              if (await appLanguage.inputValue() !== 'de') throw new Error('German browser locale was not detected');
              const deOption = appLanguage.locator('option[value="de"]');
              if ((await deOption.textContent()) !== 'Deutsch') throw new Error('Deutsch option missing from app language switcher');

              await page.goto('http://127.0.0.1:4173/my-books/book-de');
              await page.waitForLoadState('networkidle');
              const bookLanguage = page.getByRole('combobox', { name: 'Könyv nyelve' });
              await bookLanguage.waitFor({ state: 'visible' });
              if (await bookLanguage.inputValue() !== 'de') throw new Error('German book language was not loaded');
              await page.getByRole('button', { name: 'Meghívás folytatása' }).click();
              const inviteLanguage = page.getByRole('combobox', { name: 'Meghívó nyelve' });
              await inviteLanguage.waitFor({ state: 'visible' });
              await inviteLanguage.selectOption('de');
              const textarea = page.locator('textarea');
              const message = await textarea.inputValue();
              if (!message.includes('Ich habe ein MemoryBook') || !message.includes('Die Einladung ist 14 Tage gültig.')) {
                throw new Error(`German invitation message missing: ${message}`);
              }

              await page.goto('http://127.0.0.1:4173/p/token-de');
              await page.waitForLoadState('networkidle');
              await page.getByText('Deine Seite: Seite 7').waitFor({ state: 'visible' });
              await page.getByRole('button', { name: '+ Text' }).waitFor({ state: 'visible' });
              await page.getByText('+ Foto').waitFor({ state: 'visible' });
              await page.getByRole('button', { name: 'Freihand zeichnen' }).waitFor({ state: 'visible' });
              await page.getByRole('button', { name: 'Seite einreichen' }).waitFor({ state: 'visible' });
              await page.getByRole('button', { name: 'Jetzt speichern' }).waitFor({ state: 'visible' });

              console.log('GERMAN_UI_MOBILE_PASS');
            } finally {
              await context.close();
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit checked source changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/german-language-foundation-check.yml
          git add server/index.ts src/i18n.ts src/LanguageSwitcher.tsx src/inviteEditorI18n.ts src/PageInviteEditorPage.tsx src/InviteSendDialog.tsx src/OwnerBookPage.tsx
          git commit -m "Add German language foundation"
          git push origin HEAD:german-language-foundation-2026-09-08

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/memorybook-backend.log 2>/dev/null || true
          cat /tmp/memorybook-backend-restart.log 2>/dev/null || true
          cat /tmp/memorybook-preview.log 2>/dev/null || true
