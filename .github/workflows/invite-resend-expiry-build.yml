name: Invite Resend Expiry Build
on:
  push:
    branches:
      - invite-resend-expiry-2026-09-08
    paths:
      - scripts/patch-invite-resend-expiry.py
      - .github/workflows/invite-resend-expiry-build.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply invite resend and expiry patch
        run: python3 scripts/patch-invite-resend-expiry.py
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts src/OwnerBookPage.tsx src/InviteSendDialog.tsx
          git commit -m "Add invite resend state and 14-day expiry"
          git push
