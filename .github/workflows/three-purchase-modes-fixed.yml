name: Three purchase modes fixed
on:
  push:
    branches: [three-purchase-modes]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: three-purchase-modes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply_three_purchase_modes.py
      - run: npm ci
      - run: npm run build
      - name: Verify changes
        run: |
          grep -q "Cég / szervezet" src/PurchasePage.tsx
          grep -q "repeat(3,minmax(0,1fr))" src/PurchasePage.tsx
          grep -q "purchaseMode === 'organization'" server/index.ts
          grep -q "organization" server/migrations/20260909_organization_purchase_mode.sql
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PurchasePage.tsx src/publicUiI18n.ts server/index.ts server/migrations/20260909_organization_purchase_mode.sql
          git commit -m "Add organization purchase choice"
          git push origin HEAD:three-purchase-modes
