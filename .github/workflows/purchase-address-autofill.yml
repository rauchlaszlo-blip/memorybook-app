name: Purchase address autofill

on:
  push:
    branches:
      - purchase-address-autofill

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: purchase-address-autofill
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/fix_purchase_address_autofill.py
      - run: npm ci
      - run: npm run build
      - name: Verify purchase autofill changes
        run: |
          grep -F "useState('HU')" src/PurchasePage.tsx
          grep -F "parseCompanyLookupAddress" src/PurchasePage.tsx
          grep -F "setBillingAddress(parsedAddress.address)" src/PurchasePage.tsx
          grep -F "mode === 'organization'" src/PurchasePage.tsx
          grep -F "purchase_mode IN ('self', 'gift')" server/index.ts
          grep -F "rendelkezésre álló címadatok" src/publicUiI18n.ts
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PurchasePage.tsx src/publicUiI18n.ts server/index.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Autofill company and saved billing addresses"
            git push origin HEAD:purchase-address-autofill
          fi
